############################### Banner feature ###############################
banner_feature:
  enable : true
  image : "images/banner/alia.jpg"
  feature_item:
    # feature item loop
    - name : "Free placement test"
      icon : "ti-write" # icon pack : https://themify.me/themify-icons
      content : "The placement test is free! Please let us know if you think
      you are at an intermediate or advanced level and we will schedule your
      placement test."

    # feature item loop
    - name : "Complimentary virtual class"
      icon : "ti-blackboard" # icon pack : https://themify.me/themify-icons
      content : "After the placement test, you can participate in a complimentary
      sixty (60) minute virtual class in order to observe our classes and how
      they are organized to maximize Italian language learning."

    # feature item loop
    - name : "A Flexible Private Center"
      icon : "ti-comments" # icon pack : https://themify.me/themify-icons
      content : "The Accademia shapes its courses according to our partners’
      needs. Small groups, tailored courses, and flexibility are our strengths.
      Students and partners enjoy working with a medium-sized school located in
      one of the most beautiful areas of Italy."

    # feature item loop
    - name : "Design your course"
      icon : "ti-ruler-pencil" # icon pack : https://themify.me/themify-icons
      content : "Please write to info@aliassisi.it if you wish to design a
      tailored course to ft your needs. We will be happy to help you develop
      the course that best suits you!"


############################## about ##################################
about:
  enable : true
  title : "Courses available during the Summer of 2020"
  image : "images/about/allie-newgpclgEZI-unsplash.jpg"
  content : "We are currently working remotely and are conducting our coursework
  via virtual classrooms to ensure the safety of our students and teachers. It
  is a temporary way to provide continuity in our work and to avoid any
  disruptions for the many students who have already begun their courses of
  study in Italy. We hope that it will not be long until our lessons are once
  again ofered in the bright classrooms of the Accademia, a meeting place for
  students of all nationalities.
  "
  button:
    enable : true
    label : "More info"
    link : "info/course"


