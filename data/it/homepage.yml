############################### Banner feature ###############################
banner_feature:
  enable : true
  image : "images/banner/alia.jpg"
  feature_item:
    # feature item loop
    - name : "Free placement test"
      icon : "ti-write" # icon pack : https://themify.me/themify-icons
      content : "The placement test is free! Please let us know if you think
      you are at an intermediate or advanced level and we will schedule your
      placement test."

    # feature item loop
    - name : "Complimentary virtual class"
      icon : "ti-blackboard" # icon pack : https://themify.me/themify-icons
      content : "After the placement test, you can participate in a complimentary
      sixty (60) minute virtual class in order to observe our classes and how
      they are organized to maximize Italian language learning."

    # feature item loop
    - name : "Un centro privato flessibile"
      icon : "ti-comments" # icon pack : https://themify.me/themify-icons
      content : "L'Accademia modella i suoi corsi in base alle esigenze dei 
      nostri studenti. Piccoli gruppi, corsi su misura e flessibilità sono 
      i nostri punti di forza. Studenti e partner apprezzano l’accoglienza 
      e la professionalità di una scuola a misura d’uomo situata in una delle 
      zone più belle d'Italia."

    # feature item loop
    - name : "Crea il tuo corso"
      icon : "ti-ruler-pencil" # icon pack : https://themify.me/themify-icons
      content : "Scrivi a info@aliassisi.it se desideri progettare un corso 
      su misura per le tue esigenze. Saremo felici di aiutarti a sviluppare
      il corso più adatto a te!"


############################## about ##################################
about:
  enable : true
  title : "Corsi disponibili estate 2020"
  image : "images/about/allie-newgpclgEZI-unsplash.jpg"
  content : "Le nostre lezioni sono disponibili in aule virtuali. È un modo 
  temporaneo per garantire continuità nel nostro lavoro ed evitare interruzioni 
  per i numerosi studenti che hanno già iniziato i loro corsi di studio in Italia.
  Speriamo di tornare presto ad insegnare nelle aule dell'Accademia, un luogo 
  di incontro per studenti di tutte le nazionalità.
  "
  button:
    enable : true
    label : "Informazioni"
    link : "info/course"


