######################## Success story #############################
success_story:
  enable : true
  bg_image : "images/backgrounds/success-story.jpg"
  title : "Visita l'Accademia"
  content : "Ogni anno studenti da ogni parte del mondo arrivano per frequentare i nostri corsi nel cuore di
Assisi.


Lingua e cultura italiana, Lingua e cultura cinese, Dizione, Didattica delle lingue, Lingua e cultura inglese.
Canto, lezioni di pittura, lezioni id cucina, lezioni di pianoforte.


Ti aspettiamo, vieni a trovarci!
"
  # video link
  video_link : "https://youtu.be/jmvq4KPmliA"


