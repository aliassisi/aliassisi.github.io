<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--ardesia:#3d5570;--ardesia-2:#2c3f55;--fondo:#f4f6f8;--carta:#fff;--linea:#dde3ea;--testo:#1f2933;--tenue:#5f6b7a;--ok:#2f7d4f;--ok-f:#e5f4ea;--att:#a15c00;--att-f:#fdf1dc;--err:#b3261e;--err-f:#fbe7e6;--blu-f:#e8eef5}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--testo);background:var(--fondo)}
header{background:var(--ardesia);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;padding:12px 0;font-weight:600;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{background:none;border:0;color:#dbe4ee;padding:14px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
header .chi{font-size:12px;color:#c9d4e0;white-space:nowrap}
main{padding:16px;max-width:1400px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.barra .spazio{flex:1}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--linea);border-radius:6px;background:#fff;color:inherit;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
button.b{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--linea);background:#fff;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--ardesia)}
button.p{background:var(--ardesia);color:#fff;border-color:var(--ardesia)}
button.p:hover{background:var(--ardesia-2)}
button.r{color:var(--err)}
button.l{border:0;background:none;color:var(--ardesia);padding:0;cursor:pointer;font:inherit;text-decoration:underline;text-align:left}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:14px;margin-bottom:14px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.num{font-size:28px;font-weight:600;color:var(--ardesia)}
.tenue{color:var(--tenue)}
.piccolo{font-size:12px}
table{border-collapse:collapse;width:100%;background:var(--carta)}
th,td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--tenue);font-weight:600;background:#fafbfc;position:sticky;top:0}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--blu-f)}
.scroll{overflow-x:auto;border:1px solid var(--linea);border-radius:10px;background:var(--carta)}
.scroll table{border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--blu-f);color:var(--ardesia-2);white-space:nowrap}
.tag.ok{background:var(--ok-f);color:var(--ok)}.tag.att{background:var(--att-f);color:var(--att)}.tag.err{background:var(--err-f);color:var(--err)}
.planning th,.planning td{border-right:1px solid var(--linea);min-width:130px}
.planning td:first-child,.planning th:first-child{min-width:90px;font-weight:600;background:#fafbfc}
.blocco{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--ardesia);background:var(--blu-f);border-radius:4px;padding:4px 6px;margin-bottom:4px;font:inherit;font-size:12px;cursor:pointer}
.blocco b{display:block;font-size:13px}
.blocco.vuoto{border-left-color:var(--att);background:var(--att-f)}
.nomi{display:block;margin-top:3px}
.chip{display:inline-block;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:0 7px;margin:2px 3px 0 0;font-size:11px;line-height:18px;cursor:grab;white-space:nowrap}
.chip:hover{border-color:var(--ardesia)}.chip.preso{opacity:.4}
.blocco.sopra{outline:2px dashed var(--ardesia);outline-offset:1px;background:#dfe8f2}
.blocco.priv{border-left-color:var(--ok);background:var(--ok-f)}
.blocco.prev{border-style:dashed;border-width:1px 1px 1px 4px;border-color:var(--ok)}
.blocco.annul{opacity:.5;text-decoration:line-through}
.blocco.conf{border-left-color:var(--err);box-shadow:0 0 0 1px var(--err) inset}
.cal{table-layout:fixed;min-width:840px}.cal th,.cal td{border-right:1px solid var(--linea)}.cal td{height:120px}
.blocco .tag{white-space:normal;margin-top:2px}
.occ{table-layout:fixed;min-width:980px}.occ th,.occ td{padding:3px 2px;text-align:center;border-right:1px solid var(--linea);font-size:11px}.occ th:first-child,.occ td:first-child{width:190px;text-align:left;padding:5px 8px;font-size:13px}.occ th.dom{color:var(--err)}.occ td.parz{background:#cfe9d8;cursor:pointer}.occ td.pieno{background:#7cc196;cursor:pointer}.occ td.troppi{background:#e8857f;cursor:pointer}.occ td span{display:block;white-space:nowrap;overflow:visible;font-size:11px;text-align:left;position:relative;z-index:1}.occ td.oggi{box-shadow:inset 0 0 0 2px var(--ardesia)}
.tag.ev{background:#efe7f7;color:#5b3a86}.blocco.ev{border-left-color:#7c5aa6;background:#f3edf9}.chiuso{background:var(--err-f);color:var(--err);border-radius:4px;padding:3px 6px;font-size:12px;margin-bottom:4px}
.cal th.oggi{color:var(--ardesia);background:var(--blu-f)}
details summary{cursor:pointer}
.campi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.campi label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tenue)}
.campi label.largo{grid-column:1/-1}
.campi label input,.campi label select{color:var(--testo)}
dialog{border:0;border-radius:12px;padding:0;width:min(900px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,30,45,.45)}
.dtesta{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:#fff;z-index:2}
.dtesta h2{margin:0;flex:1}
.dcorpo{padding:14px 18px 20px}
#avviso{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--testo);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:90vw}
#avviso.err{background:var(--err)}
#attesa{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);background-size:200% 100%;animation:a 1s linear infinite;display:none;z-index:60}
@keyframes a{from{background-position:200% 0}to{background-position:-200% 0}}
.lista{margin:0;padding:0;list-style:none}
.lista li{padding:5px 0;border-bottom:1px solid var(--linea)}
.lista li:last-child{border:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:5px;align-items:center}
.vuoto-msg{color:var(--tenue);padding:10px 0}
@media print{header,.barra,.no-stampa,button{display:none!important}main{padding:0}.card,.scroll{border:0}body{background:#fff}th{position:static}}
@media (max-width:640px){main{padding:10px}header{gap:4px}header .chi{display:none}}
</style>
</head>
<body>
<div id="attesa"></div>
<header>
  <h1>Gestionale ALIA</h1>
  <nav id="schede"></nav>
  <span class="chi"><span id="chi"></span> <button class="l" id="esci" style="color:#dbe4ee;display:none">Esci</button></span>
</header>
<main id="main"><p class="vuoto-msg">Carico i dati…</p></main>
<dialog id="dlg"></dialog>
<div id="avviso"></div>
<datalist id="livelli"></datalist>

<script>
var D = null;                 // i dati dal foglio (carica() in Gestionale.gs)
var U = {scheda: 'oggi', cerca: '', stato: 'attivi', periodo: 'tutti', settimana: null, classeReg: '', docClasse: '', docDal: '', docAl: '', fattureTutte: false};
try { var salvata = localStorage.getItem('alia-scheda'); if (salvata) U.scheda = salvata; } catch (e) {}
/* La chiave dell'accesso (dopo il codice via email). Resta in questo browser 30 giorni. */
var CHIAVE = '';
try { CHIAVE = localStorage.getItem('alia-chiave') || ''; } catch (e) {}

var SCHEDE = [['oggi', 'Oggi'], ['studenti', 'Studenti'], ['classi', 'Classi'], ['calendario', 'Calendario'], ['attivita', 'Attività'], ['registro', 'Registro'], ['alloggi', 'Alloggi'],
  ['pagamenti', 'Pagamenti'], ['documenti', 'Diplomi e attestati'], ['email', 'Email'], ['impostazioni', 'Impostazioni']];
var MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

/* ---------- utilità ---------- */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function gg(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return +p[2] + ' ' + MESI[+p[1] - 1]; }
function ggA(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function euro(n) { if (n === '' || n === null || n === undefined || isNaN(n)) return ''; return Number(n).toLocaleString('it-IT', {style: 'currency', currency: 'EUR'}); }
function dataDa(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function isoDa(d) { return d.toISOString().slice(0, 10); }
function piu(iso, n) { var d = dataDa(iso); d.setUTCDate(d.getUTCDate() + n); return isoDa(d); }
function lunedi(iso) { var d = dataDa(iso), w = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - w); return isoDa(d); }
function sovrap(a1, a2, b1, b2) { return a1 && a2 && b1 && b2 && a1 <= b2 && a2 >= b1; }
function nome(v) { return v.nome + ' ' + v.cognome; }
function attiva(v) { return v.stato !== 'Annullata'; }

function avviso(t, err) {
  var a = $('#avviso'), d = $('#dlg');
  // Una finestra aperta sta sopra a tutto: il messaggio va dentro la finestra, se no non si vede.
  (d.open ? d : document.body).appendChild(a);
  a.textContent = t; a.className = err ? 'err' : ''; a.style.display = 'block';
  clearTimeout(avviso.t); avviso.t = setTimeout(function () { a.style.display = 'none'; }, err ? 10000 : 3500);
}
/* Chiama una funzione di Gestionale.gs; quasi tutte rispondono con i dati aggiornati. */
var IN_CORSO = 0;   // richieste che stanno salvando: intanto i pulsanti non rispondono (niente doppi salvataggi)
document.addEventListener('click', function (e) {
  if (!IN_CORSO) return;
  var b = e.target.closest('button, .b');
  if (b && b.id !== 'chiudi') { e.preventDefault(); e.stopPropagation(); avviso('Sto salvando, un momento…'); }
}, true);
function chiama(fn) {
  var args = Array.prototype.slice.call(arguments, 1), scrive = fn !== 'carica';
  $('#attesa').style.display = 'block';
  if (scrive) { IN_CORSO++; document.body.style.cursor = 'progress'; }
  var fine = function () { if (scrive) { IN_CORSO = Math.max(0, IN_CORSO - 1); if (!IN_CORSO) document.body.style.cursor = ''; } };
  return new Promise(function (ok, ko) {
    google.script.run.withSuccessHandler(function (d) { $('#attesa').style.display = 'none'; fine(); if (d && d.iscrizioni) { D = d; indici(); } ok(d); })
      .withFailureHandler(function (e) {
        $('#attesa').style.display = 'none'; fine();
        var m = String(e && e.message || e);
        if (/ACCESSO/.test(m)) { accesso(); ko(e); return; }
        avviso(m, true); ko(e);
      }).api(CHIAVE, fn, args);
  });
}
/* Una chiamata diretta (per l'accesso, che non ha ancora la chiave). */
function diretta(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { avviso(String(e && e.message || e), true); ko(e); });
    r[fn].apply(r, args);
  });
}

/* ---------- ACCESSO ---------- */
function accesso() {
  CHIAVE = '';
  try { localStorage.removeItem('alia-chiave'); } catch (e) {}
  $('#schede').innerHTML = ''; $('#chi').textContent = ''; $('#esci').style.display = 'none';
  var d = $('#dlg'); if (d.open) d.close();
  $('#main').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto"><h2>Entra nel gestionale</h2>' +
    '<p class="tenue piccolo">Scrivi la tua email: se sei dello staff ti mandiamo un codice di 6 cifre.</p>' +
    '<div class="campi" style="grid-template-columns:1fr">' + campo('a-email', 'Email', '', 'email', ' autocomplete="email"') + '</div>' +
    '<div class="barra" style="margin-top:10px"><button class="b p" id="a-manda">Mandami il codice</button></div>' +
    '<div id="a-passo2" style="display:none"><div class="campi" style="grid-template-columns:1fr">' + campo('a-codice', 'Codice ricevuto per email', '', 'text', ' inputmode="numeric" autocomplete="one-time-code" maxlength="6"') + '</div>' +
    '<div class="barra" style="margin-top:10px"><button class="b p" id="a-entra">Entra</button><button class="l" id="a-ancora">Mandamelo di nuovo</button></div>' +
    '<p class="tenue piccolo">Se non arriva, guarda nella posta indesiderata. Il codice vale 10 minuti.</p></div></div>';
  var email = function () { return $('#a-email').value.trim(); };
  var manda = function () {
    if (!email()) { avviso('Scrivi la tua email', true); return; }
    diretta('chiediCodice', email()).then(function () {
      $('#a-passo2').style.display = ''; $('#a-codice').focus();
      avviso('Se l’email è dello staff, il codice sta arrivando.');
    });
  };
  $('#a-manda').onclick = manda; $('#a-ancora').onclick = manda;
  $('#a-email').onkeydown = function (e) { if (e.key === 'Enter') manda(); };
  var entra = function () {
    diretta('verificaCodice', email(), $('#a-codice').value.trim()).then(function (r) {
      CHIAVE = r.chiave;
      try { localStorage.setItem('alia-chiave', CHIAVE); } catch (e) {}
      $('#main').innerHTML = '<p class="vuoto-msg">Carico i dati…</p>';
      avvio();
    });
  };
  $('#a-entra').onclick = entra;
  $('#a-codice').onkeydown = function (e) { if (e.key === 'Enter') entra(); };
  $('#a-email').focus();
}
$('#esci').onclick = function () {
  if (!confirm('Uscire dal gestionale su questo browser?')) return;
  var k = CHIAVE;
  diretta('esci', k).then(accesso, accesso);
};
function avvio() {
  chiama('carica').then(function () { $('#esci').style.display = CHIAVE ? '' : 'none'; disegna(); })
    .catch(function (e) { if (!/ACCESSO/.test(String(e && e.message || e))) $('#main').innerHTML = '<div class="card"><h2>Non riesco ad aprire il gestionale</h2><p>' + esc(e && e.message || e) + '</p></div>'; });
}

var ISC = {}, CLA = {};
function indici() {
  ISC = {}; CLA = {};
  D.iscrizioni.forEach(function (v) { ISC[v.id] = v; });
  D.classi.forEach(function (c) { CLA[c.id] = c; });
  $('#livelli').innerHTML = D.livelli.map(function (l) { return '<option value="' + esc(l) + '">'; }).join('');
}
function assDi(id) { return D.assegnazioni.filter(function (a) { return a.iscrizione === id; }); }
function assDiClasse(c) { return D.assegnazioni.filter(function (a) { return a.classe === c; }); }
function inClasseNelPeriodo(id, da, a) { return assDi(id).some(function (x) { return sovrap(x.dal, x.al, da, a); }); }
function privato(c) { return !!c && c.tipo === 'privato'; }
function online(c) { return !!c && c.modalita === 'online'; }
/* Il link di una lezione: il suo, o quello del corso se il corso è online. */
function linkDi(l, c) { return l.link || (online(c) ? c.link : '') || ''; }
/* Uno studente che ha bisogno di un calendario suo: lezioni individuali, per due, online. */
function individuale(v) { return !!v.formula || /privat|individ|immersion|online/i.test((v.corso_nome || '') + ' ' + (v.tema || '')); }
function perDataOra(a, b) { var x = a.data + ' ' + (a.ora_inizio || a.orario || ''), y = b.data + ' ' + (b.ora_inizio || b.orario || ''); return x < y ? -1 : x > y ? 1 : 0; }
function lezioniDi(id) {
  var r = [];
  assDi(id).forEach(function (a) { D.registro.forEach(function (l) { if (l.classe === a.classe && l.data >= a.dal && l.data <= a.al) r.push(l); }); });
  return r.sort(perDataOra);
}
function contaLez(lez) {
  var n = {prevista: 0, fatta: 0, annullata: 0, persa: 0, ore_fatte: 0};
  lez.forEach(function (l) { var s = l.stato || 'fatta'; n[s]++; if (s === 'fatta') n.ore_fatte += Number(l.ore) || 0; });
  return n;
}
function statoLez(s) { s = s || 'fatta'; return '<span class="tag ' + ({prevista: '', fatta: 'ok', annullata: 'err', persa: 'att'}[s] || '') + '">' + esc(s) + '</span>'; }
/* Le lezioni annullate che non hanno ancora un recupero. */
function daRecuperare(lez) {
  return lez.filter(function (l) { return l.stato === 'annullata' && !D.registro.some(function (x) { return x.recupero_di === l.id && x.stato !== 'annullata'; }); });
}
function recuperoDi(l) { return D.registro.filter(function (x) { return x.recupero_di === l.id && x.stato !== 'annullata'; })[0]; }
function giornoSett(iso) { return ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'][dataDa(iso).getUTCDay()]; }
/* Ore e lezioni frequentate. Facoltativi: solo dal "da" al "a", solo nella classe "classe". */
function frequenza(id, da, a, classe) {
  var ore = 0, lez = 0, tot = 0, assenze = [];
  assDi(id).forEach(function (x) {
    if (classe && x.classe !== classe) return;
    D.registro.forEach(function (l) {
      if (l.classe !== x.classe || l.data < x.dal || l.data > x.al) return;
      if ((da && l.data < da) || (a && l.data > a)) return;
      if (l.stato === 'prevista' || l.stato === 'annullata') return;
      tot += Number(l.ore) || 0;
      if (l.stato === 'persa' || String(l.assenti || '').split(/\s*,\s*/).indexOf(id) >= 0) { assenze.push(l.data); return; }
      ore += Number(l.ore) || 0; lez++;
    });
  });
  return {ore: ore, lezioni: lez, previste: tot, assenze: assenze.sort()};
}
function statoTag(s) {
  var c = {Nuova: 'att', Confermata: '', Pagata: 'ok', 'In corso': 'ok', Conclusa: '', Annullata: 'err'}[s];
  return '<span class="tag ' + (c || '') + '">' + esc(s) + '</span>';
}
function aule() { return String(D.impostazioni.aule || '').split(',').map(function (s) { return s.trim(); }).filter(String); }

/* ---------- struttura ---------- */
function disegna() {
  $('#schede').innerHTML = SCHEDE.map(function (s) { return '<button data-s="' + s[0] + '" class="' + (U.scheda === s[0] ? 'on' : '') + '">' + s[1] + '</button>'; }).join('');
  $('#chi').textContent = D.utente;
  var f = VISTE[U.scheda] || VISTE.oggi;
  $('#main').innerHTML = f();
  if (DOPO[U.scheda]) DOPO[U.scheda]();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-s]');
  if (b) { U.scheda = b.getAttribute('data-s'); try { localStorage.setItem('alia-scheda', U.scheda); } catch (x) {} disegna(); return; }
  var s = e.target.closest('[data-stud]');
  if (s) { e.preventDefault(); apriStudente(s.getAttribute('data-stud')); return; }
  var c = e.target.closest('[data-classe]');
  if (c) { e.preventDefault(); apriClasse(c.getAttribute('data-classe')); return; }
});
function linkStud(v) { return '<button class="l" data-stud="' + esc(v.id) + '">' + esc(nome(v)) + '</button>'; }

var VISTE = {}, DOPO = {};

/* ---------- OGGI ---------- */
VISTE.oggi = function () {
  var o = D.oggi, lun = lunedi(o), dom = piu(lun, 6), att = D.iscrizioni.filter(attiva);
  var inCorso = att.filter(function (v) { return v.inizio <= o && v.fine >= o; });
  var arrivi = att.filter(function (v) { return v.inizio > o && v.inizio <= piu(o, 14); }).sort(function (a, b) { return a.inizio < b.inizio ? -1 : 1; });
  var fine = att.filter(function (v) { return v.fine >= o && v.fine <= piu(o, 7); }).sort(function (a, b) { return a.fine < b.fine ? -1 : 1; });
  var nuove = D.iscrizioni.filter(function (v) { return v.stato === 'Nuova'; });
  var senza = att.filter(function (v) { return sovrap(v.inizio, v.fine, lun, dom) && !inClasseNelPeriodo(v.id, lun, dom); });
  var scad = D.fatture.filter(function (f) { return f.da_pagare > 0 && f.scadenza && f.scadenza < o; });
  var md = [], i; for (i = 0; i < 7; i++) md.push(piu(lun, i).slice(5));
  var compl = att.filter(function (v) { return v.nascita && md.indexOf(v.nascita.slice(5)) >= 0 && sovrap(v.inizio, v.fine, lun, dom); });
  var indOggi = impegni(o).filter(function (x) { return x.lez && x.stato !== 'annullata'; });
  var sistemare = daSistemare();
  var evSett = D.eventi.filter(function (e) { return e.tipo !== 'chiusura' && e.dal >= o && e.dal <= piu(o, 7); }).sort(function (a, b) { return a.dal < b.dal ? -1 : 1; });

DOPO.classi = function () {
  var inizio = U.settimana || lunedi(D.oggi);

  $('#succ').onclick = function () { U.settimana = piu(inizio, 28); disegna(); };

  $('#nuovaclasse').onclick = function () { modificaClasse(null); };
  $$('button[data-senza]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); senzaClasse(b.getAttribute('data-senza')); }; });
  // Trascina e lascia: un nome da una classe (o da "Senza classe") a un'altra classe della stessa settimana.
  var preso = null;
  $$('.chip[draggable]').forEach(function (ch) {
    ch.addEventListener('dragstart', function (e) {
      preso = {sid: ch.getAttribute('data-stud'), da: ch.getAttribute('data-da'), sett: ch.getAttribute('data-sett')};
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', preso.sid); } catch (x) {}
      ch.classList.add('preso');
    });
    ch.addEventListener('dragend', function () { ch.classList.remove('preso'); $$('.sopra').forEach(function (b) { b.classList.remove('sopra'); }); });
  });
  $$('.bersaglio').forEach(function (b) {
    var verso = function () { return b.getAttribute('data-classe') || ''; };
    var valido = function () { return preso && b.getAttribute('data-sett') === preso.sett && verso() !== preso.da; };
    b.addEventListener('dragover', function (e) { if (valido()) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; b.classList.add('sopra'); } });
    b.addEventListener('dragleave', function () { b.classList.remove('sopra'); });
    b.addEventListener('drop', function (e) {
      e.preventDefault(); b.classList.remove('sopra');
      if (!valido()) return;
      var p = preso; preso = null;
      sposta(p.sid, p.da, verso(), p.sett);

/* Sposta uno studente dalla classe "da" alla classe "a" (una delle due può mancare) a partire dalla settimana "sett".
   Se è la settimana in corso, da oggi: i giorni già passati restano nella classe di prima (registro e presenze). */
function sposta(sid, da, a, sett) {
  var v = ISC[sid], dal = sett < D.oggi && piu(sett, 6) >= D.oggi ? D.oggi : sett;
  var testo = nome(v) + (da && a ? ': da ' + CLA[da].nome + ' a ' + CLA[a].nome : a ? ' in ' + CLA[a].nome : ' fuori da ' + CLA[da].nome) + ', dal ' + giornoSett(dal) + ' ' + gg(dal) + '?';
  if (!confirm(testo)) return;
  chiama('spostaStudente', sid, da, a, dal).then(function () { avviso('Fatto: ' + nome(v)); disegna(); });
}

function senzaClasse(s) {
  var fine = piu(s, 6);
  var l = D.iscrizioni.filter(function (v) { return attiva(v) && sovrap(v.inizio, v.fine, s, fine) && !inClasseNelPeriodo(v.id, s, fine); });
  var cl = D.classi.filter(function (c) { return !privato(c) && sovrap(c.inizio, c.fine, s, fine); });
  var corpo = '<p class="tenue">Studenti presenti nella settimana senza una classe. Scegli la classe: le date sono quelle in comune tra studente e classe. Per i corsi individuali usa “Corso individuale”.</p><table><thead><tr><th>Studente</th><th>Periodo</th><th>Livello</th><th>Classe</th><th></th></tr></thead><tbody>' +
    l.map(function (v) {
      return '<tr><td>' + linkStud(v) + '<div class="tenue piccolo">' + esc(v.corso_nome) + (v.formula ? ' · ' + esc(v.formula) : '') + '</div></td><td>' + gg(v.inizio) + ' – ' + gg(v.fine) + '</td><td>' + esc(v.livello) + '</td><td><select data-ass="' + esc(v.id) + '"><option value="">—</option>' +
        cl.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.nome) + (c.livello ? ' · ' + esc(c.livello) : '') + '</option>'; }).join('') + '</select></td>' +
        '<td><button class="b piccolo" data-priv="' + esc(v.id) + '">Corso individuale</button></td></tr>';
    }).join('') + '</tbody></table>';
  var d = dialogo('Senza classe: ' + gg(s) + ' – ' + gg(fine), corpo);
  $$('[data-ass]', d).forEach(function (sel) { sel.onchange = function () {
    var v = ISC[sel.getAttribute('data-ass')], c = CLA[sel.value]; if (!c) return;

  }; });
  $$('[data-priv]', d).forEach(function (b) { b.onclick = function () { creaPrivato(b.getAttribute('data-priv')); }; });
}

function apriClasse(id) {
  var c = CLA[id]; if (!c) return;
  var ass = assDiClasse(id).filter(function (a) { return ISC[a.iscrizione]; });
  var dentro = {}; ass.forEach(function (a) { dentro[a.iscrizione] = true; });
  var cand = D.iscrizioni.filter(function (v) { return attiva(v) && !dentro[v.id] && sovrap(v.inizio, v.fine, c.inizio, c.fine); })
    .sort(function (a, b) { return (b.livello === c.livello) - (a.livello === c.livello) || (a.cognome < b.cognome ? -1 : 1); });
  var lez = D.registro.filter(function (l) { return l.classe === id; });
  // Gli altri studenti (date diverse o senza date, non conclusi): si possono aggiungere lo stesso.
  var altri = D.iscrizioni.filter(function (v) { return attiva(v) && !dentro[v.id] && cand.indexOf(v) < 0 && (!v.fine || v.fine >= D.oggi); })
    .sort(function (a, b) { return a.cognome < b.cognome ? -1 : 1; });
  var casella = function (v) {
    return '<label><input type="checkbox" value="' + esc(v.id) + '"> ' + esc(nome(v)) + ' <span class="tenue piccolo">' + esc(v.livello || '?') + ' · ' + (v.inizio ? gg(v.inizio) + '–' + gg(v.fine) : 'senza date') + (assDi(v.id).length ? ' · già in un’altra classe' : '') + '</span></label>';
  };
  var aggiungi = (cand.length ? '<div class="checks">' + cand.map(casella).join('') + '</div>' : '<div class="vuoto-msg">Nessun altro studente nel periodo della classe.</div>') +

/* ---------- CALENDARIO ---------- */
function orarioDi(t) { var m = String(t || '').match(/(\d{1,2})[:.](\d{2})\s*[–\-]\s*(\d{1,2})[:.](\d{2})/); return m ? [('0' + m[1]).slice(-2) + ':' + m[2], ('0' + m[3]).slice(-2) + ':' + m[4]] : ['', '']; }
function aMin(h) { var p = h.split(':'); return +p[0] * 60 + +p[1]; }
/* Gli impegni di un giorno: le classi di gruppo (lun–ven, con il loro orario) e le lezioni dei corsi individuali. */
function impegni(g) {
  var dow = dataDa(g).getUTCDay(), r = [];
  if (dow >= 1 && dow <= 5 && !chiusura(g)) D.classi.forEach(function (c) {
    if (privato(c) || c.inizio > g || c.fine < g) return;
    var o = orarioDi(c.orario);
    r.push({id: 'g:' + c.id + ':' + g, classe: c, titolo: c.nome, inizio: o[0], fine: o[1], aula: online(c) ? 'online' : c.aula, ins: c.insegnante, stato: ''});
  });
  D.registro.forEach(function (l) {
    var c = CLA[l.classe];
    if (l.data !== g || !privato(c)) return;
    var st = assDiClasse(c.id).filter(function (a) { return ISC[a.iscrizione] && a.dal <= g && a.al >= g; }).map(function (a) { return ISC[a.iscrizione].nome + ' ' + ISC[a.iscrizione].cognome; });
    var url = linkDi(l, c);
    r.push({id: l.id, lez: l, classe: c, titolo: st.join(' e ') || c.nome, inizio: l.ora_inizio || '', fine: l.ora_fine || '', aula: url ? 'online' : (l.aula || c.aula), ins: l.insegnante || c.insegnante, stato: l.stato || 'fatta', link: url});
  });
  eventiDel(g).forEach(function (e) {
    var o = orarioDi(e.ora);
    r.push({id: 'e:' + e.id, evento: e, classe: {id: ''}, titolo: e.nome, inizio: o[0], fine: o[1], ora: e.ora, aula: e.luogo, ins: e.responsabile, stato: ''});
  });
  return r.sort(function (a, b) { return (a.inizio || '99') < (b.inizio || '99') ? -1 : 1; });
}
/* Le lezioni che si sovrappongono (stesso insegnante o stessa aula, orari che si toccano). id → testo. */
function conflitti() {
  var giorni = {}, out = {}, aul = aule();
  D.registro.forEach(function (l) { if (privato(CLA[l.classe]) && l.data >= piu(D.oggi, -7)) giorni[l.data] = true; });
  Object.keys(giorni).forEach(function (g) {
    var e = impegni(g).filter(function (x) { return x.inizio && x.fine && x.stato !== 'annullata'; });
    e.forEach(function (a, i) { e.slice(i + 1).forEach(function (b) {
      if (aMin(a.inizio) >= aMin(b.fine) || aMin(b.inizio) >= aMin(a.fine)) return;
      if ((a.evento && classiEv(a.evento).indexOf(b.classe.id) >= 0) || (b.evento && classiEv(b.evento).indexOf(a.classe.id) >= 0)) return;
      var perche = a.ins && a.ins === b.ins ? 'stesso insegnante' : (a.aula && a.aula === b.aula && aul.indexOf(a.aula) >= 0 ? 'stessa aula' : '');
      if (!perche) return;
      out[a.id] = perche + ': ' + b.titolo + ' ' + b.inizio + '–' + b.fine;
      out[b.id] = perche + ': ' + a.titolo + ' ' + a.inizio + '–' + a.fine;
    }); });
  });
  return out;
}

/* Il primo giorno libero (non domenica) dopo la lezione, alla stessa ora: né la classe né l'insegnante hanno altro. */
function primoLibero(l) {
  var c = CLA[l.classe], ins = l.insegnante || c.insegnante, g = l.data > D.oggi ? l.data : D.oggi, i;
  if (!l.ora_inizio || !l.ora_fine) return piu(g, 7);
  for (i = 0; i < 60; i++) {
    g = piu(g, 1);
    if (dataDa(g).getUTCDay() === 0 || chiusura(g)) continue;
    var occupato = impegni(g).some(function (x) {
      if (x.stato === 'annullata' || !x.inizio || !x.fine) return false;
      if (!(x.classe.id === l.classe || (ins && x.ins === ins))) return false;
      return aMin(x.inizio) < aMin(l.ora_fine) && aMin(l.ora_inizio) < aMin(x.fine);
    });
    if (!occupato) return g;
  }
  return piu(l.data, 7);
}
function finestraRecupero(lid, annullare, dopo) {
  var l = lezioneDaId(lid), c = CLA[l.classe];
  var st = assDiClasse(c.id).filter(function (a) { return ISC[a.iscrizione] && a.dal <= l.data && a.al >= l.data; }).map(function (a) { return ISC[a.iscrizione]; });
  var prossima = primoLibero(l);
  var quando = giornoSett(l.data) + ' ' + ggA(l.data) + (l.orario ? ', ' + l.orario : '');
  var corpo = '<p>' + (annullare ? 'Annullare la lezione di <b>' + esc(quando) + '</b>' : 'Recupero della lezione annullata di <b>' + esc(quando) + '</b>') +
    (st.length ? ' (' + esc(st.map(nome).join(', ')) + ')' : '') + '?</p>' +
    (annullare ? '<p class="tenue piccolo">Non si perde: resta da recuperare finché non fissi il recupero.</p><label class="checks" style="margin:8px 0"><input type="checkbox" id="a-subito" checked> Fissa subito il recupero</label>' : '') +
    '<div class="campi" id="a-campi">' + campo('a-data', 'Data del recupero', prossima, 'date') + campo('a-inizio', 'Ora inizio', l.ora_inizio, 'time') + campo('a-fine', 'Ora fine', l.ora_fine, 'time') + '</div>' +
    '<label class="checks" style="margin:12px 0"><input type="checkbox" id="a-avvisa"' + (st.some(function (v) { return v.email; }) ? ' checked' : ' disabled') + '> ' +
    (annullare ? 'Avvisa lo studente per email (con il file che aggiorna il suo calendario)' : 'Manda allo studente la nuova data') + '</label>';
  var d = dialogo(annullare ? 'Annulla la lezione' : 'Fissa il recupero', corpo, '<button class="b p" id="a-ok">' + (annullare ? 'Annulla la lezione' : 'Salva il recupero') + '</button>');
  if (annullare) $('#a-subito', d).onchange = function () { $('#a-campi', d).style.display = this.checked ? '' : 'none'; };
  $('#a-ok', d).onclick = function () {
    var subito = !annullare || $('#a-subito', d).checked;
    if (subito && chiusura($('#a-data', d).value) && !confirm('Quel giorno la scuola è chiusa (' + chiusura($('#a-data', d).value).nome + '). Continuare?')) return;
    var nuova = subito ? {data: $('#a-data', d).value, ora_inizio: $('#a-inizio', d).value, ora_fine: $('#a-fine', d).value} : null;
    if (subito && !nuova.data) { avviso('Scrivi la data del recupero', true); return; }
    var avvisa = $('#a-avvisa', d).checked;
    var fatto = function (r) {
      d.close(); disegna();
      var conf = r && r.recupero ? conflitti()[r.recupero] : '';
      avviso((annullare ? 'Lezione annullata' : 'Recupero fissato') + (r && r.inviate ? ', email mandata' : '') + (conf ? '. Attenzione, il recupero si sovrappone: ' + conf : ''), !!conf);
      if (dopo) dopo();
    };
    if (annullare) chiama('annullaLezione', lid, nuova, avvisa).then(fatto);
    else chiama('recuperaLezione', lid, nuova, avvisa).then(fatto);
  };
}

function lezione(id, classeId, dopo) {
  var c = CLA[classeId];
  var prec = D.registro.filter(function (l) { return l.classe === c.id; }).sort(perDataOra).slice(-1)[0];
  var o = orarioDi(c.orario);
  var l = id ? lezioneDaId(id) : {data: D.oggi, ora_inizio: (prec && prec.ora_inizio) || o[0], ora_fine: (prec && prec.ora_fine) || o[1], orario: (prec && prec.orario) || c.orario,
    ore: '', aula: (prec && prec.aula) || c.aula, insegnante: (prec && prec.insegnante) || c.insegnante, assenti: '', stato: privato(c) ? 'prevista' : 'fatta'};
  var stato = l.stato || 'fatta', cambiato = false;
  if (id && stato === 'prevista' && l.data <= D.oggi) { stato = 'fatta'; cambiato = true; }
  var assenti = String(l.assenti || '').split(/\s*,\s*/);
  var corpo = (cambiato ? '<p class="tag att">Era “prevista”: salvando diventa “fatta”. Cambia lo stato se non si è fatta.</p>' : '') +
    '<div class="campi">' + campo('l-data', 'Data', l.data, 'date') + campo('l-inizio', 'Ora inizio', l.ora_inizio, 'time') + campo('l-fine', 'Ora fine', l.ora_fine, 'time') +
    campo('l-ore', 'Ore di lezione', l.ore, 'number', ' step="0.25" min="0" max="12"') + scelta('l-aula', 'Aula', l.aula, [''].concat(aule())) + campo('l-insegnante', 'Insegnante', l.insegnante) +
    scelta('l-stato', 'Stato', stato, D.stati_lezione) +
    campo('l-link', 'Link Zoom di questa lezione' + (online(c) && c.link ? ' (vuoto = quello del corso)' : ''), l.link, 'url', ' placeholder="' + esc(online(c) ? c.link : 'https://…') + '"') +
    COL_REG.map(function (k) { return '<label' + (k[0] === 'note' ? ' class="largo"' : '') + '>' + k[1] + '<textarea id="l-' + k[0] + '" style="min-height:44px">' + esc(l[k[0]]) + '</textarea></label>'; }).join('') + '</div>' +
    '<h3>Assenti</h3><div class="checks" id="l-assenti"></div>';
  var d = dialogo((id ? 'Lezione del ' + ggA(l.data) : 'Nuova lezione') + ' · ' + esc(c.nome), corpo, (id ? '<button class="b r" id="l-elimina">Elimina</button>' : '') + '<button class="b p" id="l-salva">Salva</button>');
  function studenti() {
    var giorno = $('#l-data', d).value;
    var ass = assDiClasse(c.id).filter(function (a) { return ISC[a.iscrizione] && a.dal <= giorno && a.al >= giorno; });
    $('#l-assenti', d).innerHTML = ass.length ? ass.map(function (a) { return '<label><input type="checkbox" value="' + esc(a.iscrizione) + '"' + (assenti.indexOf(a.iscrizione) >= 0 ? ' checked' : '') + '> ' + esc(nome(ISC[a.iscrizione])) + '</label>'; }).join('') : '<span class="tenue">Nessuno studente in classe in questo giorno.</span>';
  }
  function ore() {
    var a = $('#l-inizio', d).value, b = $('#l-fine', d).value;
    if (a && b && aMin(b) > aMin(a)) $('#l-ore', d).value = Math.round((aMin(b) - aMin(a)) / 15) / 4;
  }
  studenti(); if (!l.ore) ore();
  $('#l-data', d).onchange = studenti;
  $('#l-inizio', d).onchange = ore; $('#l-fine', d).onchange = ore;
  $('#l-salva', d).onclick = function () {
    var x = {id: id || '', classe: c.id, data: $('#l-data', d).value, ora_inizio: $('#l-inizio', d).value, ora_fine: $('#l-fine', d).value, orario: l.orario || '',
      ore: $('#l-ore', d).value, aula: $('#l-aula', d).value, insegnante: $('#l-insegnante', d).value, stato: $('#l-stato', d).value, link: $('#l-link', d).value.trim(),
      assenti: $$('#l-assenti input:checked', d).map(function (i) { return i.value; })};
    COL_REG.forEach(function (k) { x[k[0]] = $('#l-' + k[0], d).value; });
    if (!x.data) { avviso('Scrivi la data', true); return; }
    if (chiusura(x.data) && x.data !== l.data && !confirm('Il ' + ggA(x.data) + ' la scuola è chiusa (' + chiusura(x.data).nome + '). Salvare lo stesso?')) return;
    if (id && x.stato === 'annullata' && l.stato !== 'annullata') {
      x.stato = l.stato || 'prevista';
      chiama('salvaLezione', x).then(function () { disegna(); annulla(id, dopo); });
      return;
    }
    chiama('salvaLezione', x).then(function () { d.close(); avviso('Lezione salvata'); disegna(); if (dopo) dopo(); });
  };
  if (id) $('#l-elimina', d).onclick = function () { if (confirm('Eliminare questa lezione?')) chiama('eliminaLezione', id).then(function () { d.close(); disegna(); if (dopo) dopo(); }); };
}

/* ---------- ALLOGGI ---------- */
function alloggioId(id) { return D.alloggi.filter(function (a) { return a.id === id; })[0]; }
function nomeTipo(t) { var x = D.tipi_alloggio.filter(function (y) { return y[0] === t; })[0]; return x ? x[1] : t; }
/* Il tipo chiesto nel modulo del sito (in italiano o in inglese). */
function tipoRichiesto(v) {
  var t = String(v.alloggio || '');
  if (/indipendente|one-bedroom|flat$/i.test(t) && !/condiviso|shared/i.test(t)) return 'indipendente';
  if (/doppia|double/i.test(t)) return /bagno|bathroom/i.test(t) ? 'doppia_bagno' : 'doppia';
  if (/singola|single/i.test(t)) return /bagno|bathroom/i.test(t) ? 'singola_bagno' : 'singola';
  return '';
}
function vuoleAlloggio(v) { return !!v.alloggio && !/^(nessun|no accommodation)/i.test(v.alloggio); }
function soggiorniDi(id) { return D.soggiorni.filter(function (x) { return x.iscrizione === id; }).sort(function (a, b) { return a.arrivo < b.arrivo ? -1 : 1; }); }
function dentro(alloggio, notte, escludi) { return D.soggiorni.filter(function (x) { return x.alloggio === alloggio && x.id !== escludi && x.arrivo <= notte && x.partenza > notte; }); }
/* Le notti piene (posti già tutti presi) tra arrivo e partenza. */
function nottiPiene(a, arrivo, partenza, escludi) {
  var r = [], g;
  for (g = arrivo; g < partenza; g = piu(g, 1)) if (dentro(a.id, g, escludi).length + 1 > (Number(a.posti) || 1)) r.push(g);
  return r;
}
/* Le date proposte: dal giorno prima del corso, per le settimane di alloggio chieste. */
function dateAlloggio(v) {
  var arrivo = v.inizio ? piu(v.inizio, -1) : D.oggi;
  var sett = Number(v.settimane_alloggio) || Number(v.settimane) || (v.fine ? Math.ceil((dataDa(v.fine) - dataDa(v.inizio) + 86400000) / 604800000) : 1);
  return {arrivo: arrivo, partenza: piu(arrivo, 7 * sett)};
}
function daSistemare() {
  return D.iscrizioni.filter(function (v) { return attiva(v) && vuoleAlloggio(v) && (v.fine || v.inizio || '') >= D.oggi && !soggiorniDi(v.id).length; })
    .sort(function (a, b) { return a.inizio < b.inizio ? -1 : 1; });
}

      });

        '<td>' + gg(dt.arrivo) + ' → ' + gg(dt.partenza) + '<div class="tenue piccolo">' + Math.round((dataDa(dt.partenza) - dataDa(dt.arrivo)) / 86400000) + ' notti</div></td>' +

  }).join('') + '</tr></thead><tbody>' + (attivi.map(function (a) {
    return '<tr><td><button class="l" data-alloggio="' + esc(a.id) + '">' + esc(a.nome) + '</button><div class="tenue piccolo">' + esc(nomeTipo(a.tipo)) + ' · ' + esc(a.posti) + ' posti</div></td>' + giorni.map(function (g) {
      var p = dentro(a.id, g), n = Number(a.posti) || 1;

      var nomi = p.map(function (x) { var v = ISC[x.iscrizione]; return v ? nome(v) : x.iscrizione; });
      var arrivi = p.filter(function (x) { return x.arrivo === g; });

    '<div class="card"><div class="tenue">Partenze nei prossimi 7 giorni</div>' + (par.length ? '<ul class="lista">' + par.map(function (x) { return riga(x, x.partenza); }).join('') + '</ul>' : '<div class="tenue piccolo">Nessuno.</div>') + '</div></div>';
  var non = D.alloggi.filter(function (a) { return a.attivo === 'no'; });
  if (non.length) h += '<h3>Non attivi</h3><ul class="lista">' + non.map(function (a) { return '<li><button class="l" data-alloggio="' + esc(a.id) + '">' + esc(a.nome) + '</button></li>'; }).join('') + '</ul>';

/* Salva una prenotazione; se l'alloggio è pieno chiede se prenotare lo stesso. */
function salvaPrenotazione(x, dopo) {
  var vai = function (forza) {
    return chiama('prenotaAlloggio', x, forza).then(function () { avviso('Alloggio assegnato'); disegna(); if (dopo) dopo(); })
      .catch(function (e) {
        var m = String(e && e.message || e);
        if (!forza && m.indexOf('PIENO') === 0 && confirm(m.slice(7) + '\n\nPrenotare lo stesso?')) return vai(true);
      });
  };
  return vai(false);
}

function prenotaDialogo(idStud, idSog) {
  var v = ISC[idStud], x = idSog ? D.soggiorni.filter(function (y) { return y.id === idSog; })[0] : null;
  var dt = x ? {arrivo: x.arrivo, partenza: x.partenza} : dateAlloggio(v), tipo = tipoRichiesto(v);
  var corpo = '<p class="piccolo">' + esc(nome(v)) + ' · corso ' + gg(v.inizio) + ' – ' + gg(v.fine) + (v.alloggio ? ' · ha chiesto: <b>' + esc(v.alloggio) + '</b>' + (v.settimane_alloggio ? ', ' + esc(v.settimane_alloggio) + ' settimane' : '') : '') + '</p>' +
    '<div class="campi">' + campo('p-arrivo', 'Arrivo', dt.arrivo, 'date') + campo('p-partenza', 'Partenza (lascia la camera)', dt.partenza, 'date') +
    '<label>Alloggio<select id="p-alloggio"></select></label>' + campo('p-note', 'Note', x ? x.note : '', 'textarea') + '</div>';
  var d = dialogo(x ? 'Modifica l’alloggio' : 'Assegna un alloggio', corpo, '<button class="b p" id="p-salva">Salva</button>');
  function opzioni() {
    var a1 = $('#p-arrivo', d).value, a2 = $('#p-partenza', d).value, scelto = $('#p-alloggio', d).value || (x ? x.alloggio : '');
    $('#p-alloggio', d).innerHTML = D.alloggi.filter(function (a) { return a.attivo !== 'no' || (x && a.id === x.alloggio); })
      .sort(function (a, b) { return (b.tipo === tipo) - (a.tipo === tipo); }).map(function (a) {
        var pieno = a1 && a2 && a2 > a1 ? nottiPiene(a, a1, a2, x ? x.id : '').length : 0;
        return '<option value="' + esc(a.id) + '"' + (a.id === scelto ? ' selected' : '') + '>' + (pieno ? '✕ ' : '✓ ') + esc(a.nome) + ' · ' + esc(nomeTipo(a.tipo)) + (pieno ? ' (pieno ' + pieno + ' notti)' : '') + '</option>';
      }).join('');
  }
  opzioni();
  $('#p-arrivo', d).onchange = opzioni; $('#p-partenza', d).onchange = opzioni;
  $('#p-salva', d).onclick = function () {
    salvaPrenotazione({id: x ? x.id : '', iscrizione: idStud, alloggio: $('#p-alloggio', d).value, arrivo: $('#p-arrivo', d).value, partenza: $('#p-partenza', d).value, note: $('#p-note', d).value},
      function () { apriStudente(idStud); });
  };
}

    scelta('al-attivo', 'Attivo', a.attivo || 'si', [['si', 'Sì'], ['no', 'No (non si propone più)']]) +
    campo('al-indirizzo', 'Indirizzo', a.indirizzo) + campo('al-contatto', 'Proprietario / contatto (solo per lo staff)', a.contatto) +

/* ---------- CHIUSURE, LABORATORI E ATTIVITÀ ---------- */
function chiusura(g) { return D.eventi.filter(function (e) { return e.tipo === 'chiusura' && e.dal <= g && e.al >= g; })[0]; }
function eventiDel(g) { return D.eventi.filter(function (e) { return e.tipo !== 'chiusura' && e.dal <= g && e.al >= g; }); }
function eventoId(id) { return D.eventi.filter(function (e) { return e.id === id; })[0]; }
function iscrittiA(id) { return D.partecipanti.filter(function (p) { return p.evento === id; }).map(function (p) { return ISC[p.iscrizione]; }).filter(Boolean); }
/* Uno studente dei corsi di gruppo (non solo lezioni individuali o online): le attività sono comprese per lui. */
function inGruppo(v) { return !v.formula && !/privat|individ|online/i.test((v.corso_nome || '') + ' ' + (v.tema || '')); }
function presentiIl(g) { return D.iscrizioni.filter(function (v) { return attiva(v) && inGruppo(v) && v.stato !== 'Nuova' && v.inizio && v.fine && v.inizio <= g && v.fine >= g; }); }
function perTutti(e) { return e.tipo !== 'chiusura' && e.per !== 'iscritti' && e.per !== 'classi'; }
function classiEv(e) { return e.per === 'classi' ? String(e.classi || '').split(/\s*,\s*/).filter(String) : []; }
/* Chi partecipa a un evento: tutti i gruppi, alcune classi (nelle loro ore), o gli iscritti. */
function partecipantiDi(e) {
  if (e.per === 'classi') {
    var cl = classiEv(e);
    return D.iscrizioni.filter(function (v) { return attiva(v) && assDi(v.id).some(function (a) { return cl.indexOf(a.classe) >= 0 && a.dal <= e.dal && a.al >= e.dal; }); });
  }
  return perTutti(e) ? presentiIl(e.dal) : iscrittiA(e.id);
}
function nomiClassi(e) { return classiEv(e).map(function (c) { return CLA[c] ? CLA[c].nome : c; }).join(', '); }
function chiVa(e) {
  if (e.per === 'classi') return nomiClassi(e) + ' (' + partecipantiDi(e).length + ')';
  return perTutti(e) ? 'tutti (' + presentiIl(e.dal).length + ')' : iscrittiA(e.id).length + (e.posti ? '/' + e.posti : '') + ' iscritti';
}
function gruppiNellaSettimana(lun) { var dom = piu(lun, 6); return D.classi.filter(function (c) { return !privato(c) && c.inizio <= dom && c.fine >= lun; }); }
/* Le attività settimanali (dal sito) e, per una settimana, quelle già programmate e le classi che non le hanno ancora. */
function settimana(lun) {
  var dom = piu(lun, 6), gruppi = gruppiNellaSettimana(lun);
  return D.settimanali.map(function (a) {
    var ev = D.eventi.filter(function (e) { return e.tipo === 'attivita' && e.nome === a.nome && e.dal >= lun && e.dal <= dom; });
    var tutti = ev.some(perTutti);
    var senza = tutti ? [] : gruppi.filter(function (c) { return !ev.some(function (e) { return classiEv(e).indexOf(c.id) >= 0; }); });
    return {a: a, ev: ev, senza: senza, fatto: tutti || (ev.length > 0 && !senza.length) || (!gruppi.length && ev.length > 0)};
  });
}
/* Il primo giorno utile della settimana (da oggi, lun–ven, scuola aperta) per programmare un'attività. */
function giornoUtile(lun) {
  for (var i = 0; i < 5; i++) { var g = piu(lun, i); if (g >= D.oggi && !chiusura(g)) return g; }
  return lun < D.oggi ? D.oggi : lun;
}
/* Programma un'attività settimanale; con "classe" è dentro le lezioni di quella classe. */
function programma(a, lun, classe) {
  var c = classe ? CLA[classe] : null, g = giornoUtile(lun);
  evento(null, 'attivita', {tipo: 'attivita', nome: a.nome, nome_en: a.nome_en, dal: g, al: g, ora: '', luogo: c ? (c.aula || '') : '', responsabile: c ? (c.insegnante || '') : '',
    posti: '', note: '', per: c ? 'classi' : 'tutti', classi: c ? c.id : ''});
}

        '<td class="piccolo">' + inviati.map(function (p) { return esc(p.data.slice(0, 10)) + ' ' + esc(p.chiave.split(':')[3] || '') + (p.esito !== 'inviato' ? ' (' + esc(p.esito) + ')' : ''); }).join('<br>') + '</td>' +
        '<td>' + (f.da_pagare > 0 && f.iscrizione ? '<button class="b piccolo" data-prom="' + esc(f.fic_id) + '">Manda ora</button>' : '') + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="vuoto-msg">Niente da pagare. Premi “Aggiorna” per leggere le ultime fatture.</td></tr>') + '</tbody></table></div>';
  if (senzaFattura.length) h += '<h3>Iniziano entro 30 giorni e non hanno ancora fattura o proforma</h3><div class="card"><ul class="lista">' + senzaFattura.map(function (v) { return '<li>' + linkStud(v) + ' <span class="tenue piccolo">' + gg(v.inizio) + ' · ' + esc(v.corso_nome) + ' · ' + euro(v.prezzo || v.totale) + '</span></li>'; }).join('') + '</ul></div>';
  return h;
};
DOPO.pagamenti = function () {
  if (!$('#sync')) return;
  $('#sync').onclick = function () { chiama('sincronizzaFIC').then(function () { avviso('Aggiornato da Fatture in Cloud'); disegna(); }); };
  $('#tutte').onchange = function () { U.fattureTutte = this.checked; disegna(); };
  $$('[data-abbina]').forEach(function (s) { s.onchange = function () { chiama('abbinaFattura', s.getAttribute('data-abbina'), s.value).then(function () { avviso('Abbinata'); disegna(); }); }; });
  $$('[data-prom]').forEach(function (b) { b.onclick = function () {
    var prova = D.impostazioni.promemoria !== 'si';
    if (!confirm(prova ? 'I promemoria sono in prova: l’email va a info@ (non allo studente). Continuare?' : 'Mandare ora il promemoria allo studente?')) return;
    chiama('mandaPromemoria', b.getAttribute('data-prom')).then(function () { avviso('Promemoria mandato'); disegna(); });
  }; });
};

/* ---------- DIPLOMI E ATTESTATI ---------- */
function creaDoc(tipo, ids) {
  avviso('Creo il PDF… può volerci un minuto.');
  return chiama('creaDocumenti', tipo, ids).then(function (d) {
    disegna();
    dialogo('PDF pronto', '<p>' + ids.length + ' ' + (tipo === 'diploma' ? (ids.length > 1 ? 'diplomi' : 'diploma') : (ids.length > 1 ? 'attestati' : 'attestato')) + ', una pagina per studente.</p><p><a class="b p" style="text-decoration:none;display:inline-block" href="' + esc(d.creato) + '" target="_blank" rel="noopener">Apri il PDF da stampare</a></p>');
  });
}
VISTE.documenti = function () {
  var o = D.oggi;
  if (!U.docDal) { U.docDal = lunedi(o); U.docAl = piu(lunedi(o), 13); }
  var l = U.docClasse ? assDiClasse(U.docClasse).map(function (a) { return ISC[a.iscrizione]; }).filter(Boolean)
    : D.iscrizioni.filter(function (v) { return v.fine >= U.docDal && v.fine <= U.docAl; });
  l = l.filter(attiva).sort(function (a, b) { return a.cognome < b.cognome ? -1 : 1; });
  var link = function (k) { return D.impostazioni[k] ? '<a href="https://drive.google.com/open?id=' + esc(D.impostazioni[k]) + '" target="_blank" rel="noopener">apri</a>' : '<span class="tag err">manca</span>'; };
  return '<div class="card piccolo">Modelli: diploma ' + link('modello_diploma') + ' · attestato ' + link('modello_attestato') +
    '. Campi: {{nome}} {{cognome}} {{periodo}} {{livello}} {{corso}} {{ore}} {{dal}} {{al}} {{nascita}} {{luogo_nascita}} {{nazionalita}} {{data}} {{numero}}. Si cambiano in Impostazioni.</div>' +
    '<div class="barra"><select id="dclasse"><option value="">Studenti che finiscono tra…</option>' + D.classi.slice().sort(function (a, b) { return a.fine < b.fine ? 1 : -1; }).map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === U.docClasse ? ' selected' : '') + '>Classe: ' + esc(c.nome) + '</option>'; }).join('') + '</select>' +
    (U.docClasse ? '' : '<input type="date" id="ddal" value="' + esc(U.docDal) + '"> e <input type="date" id="dal2" value="' + esc(U.docAl) + '">') + '</div>' +
    '<div class="scroll"><table><thead><tr><th><input type="checkbox" id="dtutti" checked></th><th>Studente</th><th>Periodo</th><th>Corso</th><th>Livello iniziale</th><th>Livello raggiunto</th><th>Ore</th><th>Già fatti</th></tr></thead><tbody>' +
    (l.map(function (v) {
      var f = frequenza(v.id), fatti = D.documenti.filter(function (x) { return x.iscrizione === v.id; }).map(function (x) { return '<a href="' + esc(x.link) + '" target="_blank" rel="noopener">' + esc(x.tipo) + '</a>'; }).join(', ');
      return '<tr><td><input type="checkbox" class="dsel" value="' + esc(v.id) + '" checked></td><td>' + linkStud(v) + '</td><td>' + gg(v.inizio) + ' – ' + gg(v.fine) + '</td><td>' + esc(v.corso_nome) + '</td><td>' + esc(v.livello) + '</td>' +
        '<td><input data-liv="' + esc(v.id) + '" value="' + esc(v.livello_finale) + '" list="livelli" style="width:80px"></td><td>' + f.ore + (f.previste ? '/' + f.previste : '') + '</td><td class="piccolo">' + fatti + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="vuoto-msg">Nessuno studente.</td></tr>') + '</tbody></table></div>' +
    '<div class="barra" style="margin-top:12px"><span class="spazio"></span><button class="b" id="dattest">Crea gli attestati dei selezionati</button><button class="b p" id="ddipl">Crea i diplomi dei selezionati</button></div>' +
    '<h3>Ultimi documenti</h3><div class="scroll"><table><thead><tr><th>Creato</th><th>Tipo</th><th>N.</th><th>Studente</th><th>PDF</th></tr></thead><tbody>' +
    (D.documenti.slice(-30).reverse().map(function (x) { return '<tr><td>' + esc(x.data) + '</td><td>' + esc(x.tipo) + '</td><td>' + esc(x.numero) + '</td><td>' + esc(x.studente) + '</td><td><a href="' + esc(x.link) + '" target="_blank" rel="noopener">PDF</a></td></tr>'; }).join('') || '<tr><td colspan="5" class="vuoto-msg">Ancora nessuno.</td></tr>') + '</tbody></table></div>';
};
DOPO.documenti = function () {
  $('#dclasse').onchange = function () { U.docClasse = this.value; disegna(); };
  if ($('#ddal')) { $('#ddal').onchange = function () { U.docDal = this.value; disegna(); }; $('#dal2').onchange = function () { U.docAl = this.value; disegna(); }; }
  $('#dtutti').onchange = function () { var on = this.checked; $$('.dsel').forEach(function (c) { c.checked = on; }); };
  $$('[data-liv]').forEach(function (i) { i.onchange = function () { chiama('salvaIscrizione', i.getAttribute('data-liv'), {livello_finale: i.value.trim()}).then(function () { avviso('Livello salvato'); }); }; });
  var sel = function () { return $$('.dsel:checked').map(function (c) { return c.value; }); };
  $('#ddipl').onclick = function () { var s = sel(); if (s.length) creaDoc('diploma', s); };
  $('#dattest').onclick = function () { var s = sel(); if (s.length) creaDoc('attestato', s); };
};

/* ---------- EMAIL AUTOMATICHE ---------- */
var MODI = [['no', 'Spente'], ['prova', 'Prova: vanno a info@, non agli studenti'], ['si', 'Attive: vanno agli studenti']];
VISTE.email = function () {
  var i = D.impostazioni;
  return (D.invii_attivi ? '' : '<div class="card"><b>Gli invii automatici non sono ancora attivi.</b> Partono ogni mattina alle 8 (i link delle lezioni online ogni ora). <button class="b p" id="attiva">Attiva</button></div>') +
    '<div class="card"><h3 style="margin-top:0">Promemoria di pagamento (Fatture in Cloud)</h3><div class="campi">' + scelta('e-promemoria', 'Stato', i.promemoria, MODI) +
    campo('e-promemoria_giorni', 'Giorni prima della scadenza', i.promemoria_giorni, 'number') + campo('e-dati_pagamento', 'Come pagare (IBAN, intestazione…), va in fondo all’email', i.dati_pagamento, 'textarea') + '</div>' +
    '<p class="tenue piccolo">Una email N giorni prima della scadenza, una 3 giorni dopo, una 17 giorni dopo. Solo per fatture e proforma abbinate a un’iscrizione. Le proforma si fermano quando l’iscrizione risulta pagata. Italiano o inglese secondo la lingua dell’iscrizione.</p></div>' +
    '<div class="card"><h3 style="margin-top:0">Auguri di compleanno</h3><div class="campi">' + scelta('e-compleanni', 'Stato', i.compleanni, MODI) +
    scelta('e-compleanni_chi', 'A chi', i.compleanni_chi, [['in_corso', 'Solo a chi è in corso'], ['tutti', 'Anche agli ex studenti']]) +
    campo('e-testo_compleanno_it', 'Testo in italiano ({{nome}})', i.testo_compleanno_it, 'textarea') + campo('e-testo_compleanno_en', 'Testo in inglese', i.testo_compleanno_en, 'textarea') + '</div></div>' +
    '<div class="card"><h3 style="margin-top:0">Email prima dell’arrivo</h3><div class="campi">' + scelta('e-benvenuto', 'Stato', i.benvenuto, MODI) +
    campo('e-benvenuto_giorni', 'Giorni prima dell’inizio', i.benvenuto_giorni, 'number') +
    campo('e-testo_benvenuto_it', 'Testo in italiano ({{nome}} {{inizio}} {{fine}} {{corso}} {{alloggio}})', i.testo_benvenuto_it, 'textarea') + campo('e-testo_benvenuto_en', 'Testo in inglese', i.testo_benvenuto_en, 'textarea') + '</div>' +
    '<p class="tenue piccolo">Solo per iscrizioni Confermate o Pagate. Controlla l’indirizzo e l’orario nel testo.</p></div>' +
    '<div class="card"><h3 style="margin-top:0">Link delle lezioni online</h3><div class="campi">' + scelta('e-link_online', 'Stato', i.link_online, MODI) +
    campo('e-link_ore', 'Quante ore prima della lezione', i.link_ore, 'number', ' min="1" max="72"') +
    campo('e-testo_link_it', 'Testo in italiano ({{nome}} {{quando}} {{link}})', i.testo_link_it, 'textarea') + campo('e-testo_link_en', 'Testo in inglese', i.testo_link_en, 'textarea') + '</div>' +
    '<p class="tenue piccolo">Una email per lezione online prevista, con il link del corso (o quello della lezione). Lo script controlla ogni ora. Gli orari sono in ora italiana: scrivilo nel testo per chi è all’estero.</p></div>' +
    '<div class="card"><h3 style="margin-top:0">Riepilogo per lo staff</h3><div class="campi">' + scelta('e-riepilogo', 'Ogni mattina a info@', i.riepilogo, [['si', 'Sì'], ['no', 'No']]) + '</div>' +
    '<p class="tenue piccolo">Arrivi e partenze della settimana, compleanni in classe, iscrizioni nuove, pagamenti scaduti.</p></div>' +
    '<div class="barra"><span class="spazio"></span><button class="b p" id="e-salva">Salva</button></div>' +
    '<h3>Ultime email automatiche</h3><div class="scroll"><table><thead><tr><th>Data</th><th>Tipo</th><th>Studente</th><th>Email</th><th>Esito</th></tr></thead><tbody>' +
    (D.promemoria.slice(-50).reverse().map(function (p) { var v = ISC[p.iscrizione]; return '<tr><td>' + esc(p.data) + '</td><td>' + esc(p.tipo) + '</td><td>' + (v ? linkStud(v) : esc(p.iscrizione)) + '</td><td>' + esc(p.email) + '</td><td>' + esc(p.esito) + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="vuoto-msg">Nessuna.</td></tr>') + '</tbody></table></div>';
};
DOPO.email = function () {
  if ($('#attiva')) $('#attiva').onclick = function () { chiama('attivaInvii').then(function () { avviso('Invii automatici attivi'); disegna(); }); };
  $('#e-salva').onclick = function () {
    var o = {};
    ['promemoria', 'promemoria_giorni', 'dati_pagamento', 'compleanni', 'compleanni_chi', 'testo_compleanno_it', 'testo_compleanno_en', 'benvenuto', 'benvenuto_giorni', 'testo_benvenuto_it', 'testo_benvenuto_en', 'riepilogo', 'link_online', 'link_ore', 'testo_link_it', 'testo_link_en'].forEach(function (k) { o[k] = $('#e-' + k).value; });
    chiama('salvaImpostazioni', o).then(function () { avviso('Salvato'); disegna(); });
  };
};

/* ---------- IMPOSTAZIONI ---------- */
VISTE.impostazioni = function () {
  var i = D.impostazioni;
  return '<div class="card"><h3 style="margin-top:0">Staff e aule</h3><div class="campi">' +
    campo('i-staff', 'Email dello staff che può aprire il gestionale (separate da virgola)', i.staff, 'textarea') +
    campo('i-aule', 'Aule (separate da virgola)', i.aule) + campo('i-url_gestionale', 'Link di questo gestionale (per il menu del foglio e il riepilogo)', i.url_gestionale) +
    campo('i-url_sito', 'Indirizzo del sito (da qui si leggono chiusure e laboratori)', i.url_sito) + '</div></div>' +
    '<div class="card"><h3 style="margin-top:0">Modelli di diploma e attestato</h3><p class="tenue piccolo">Un Documento o una Presentazione Google (per un diploma grafico, orizzontale, meglio una Presentazione). Se il modello è in Word o PowerPoint: caricalo su Drive, aprilo con Google e scegli File → Salva come Documenti/Presentazioni Google. Poi incolla qui il link. Scrivi i campi tra doppie graffe: {{nome}} {{cognome}} {{periodo}} {{livello}} {{corso}} {{ore}} {{data}} {{numero}}…</p><div class="campi">' +
    campo('i-modello_diploma', 'Link del modello del diploma', i.modello_diploma ? 'https://drive.google.com/open?id=' + i.modello_diploma : '') +
    campo('i-modello_attestato', 'Link del modello dell’attestato', i.modello_attestato ? 'https://drive.google.com/open?id=' + i.modello_attestato : '') + '</div></div>' +
    '<div class="card"><h3 style="margin-top:0">Fatture in Cloud</h3><p class="tenue piccolo">' + (D.fic_token ? '<span class="tag ok">collegato</span> Azienda ' + esc(i.fic_azienda || '(si legge al primo aggiornamento)') + '. Per cambiarlo incolla un token nuovo.' : '<span class="tag att">non collegato</span> Come ottenere il token: ISTRUZIONI.md, punto 7.') + '</p><div class="campi">' +
    campo('i-fic_token', 'Token (non si rilegge dopo il salvataggio)', '', 'password', ' autocomplete="off"') + '</div></div>' +
    '<div class="barra"><a class="b" style="text-decoration:none" href="' + esc(D.foglio) + '" target="_blank" rel="noopener">Apri il foglio Google</a><span class="spazio"></span><button class="b p" id="i-salva">Salva</button></div>';
};
DOPO.impostazioni = function () {
  $('#i-salva').onclick = function () {
    var o = {};
    ['staff', 'aule', 'url_gestionale', 'url_sito', 'modello_diploma', 'modello_attestato', 'fic_token'].forEach(function (k) { o[k] = $('#i-' + k).value.trim(); });
    chiama('salvaImpostazioni', o).then(function () { avviso('Impostazioni salvate'); disegna(); });
  };
};

avvio();
</script>
