<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--ardesia:#3d5570;--ardesia-2:#2c3f55;--fondo:#f4f6f8;--carta:#fff;--linea:#dde3ea;--testo:#1f2933;--tenue:#5f6b7a;--ok:#2f7d4f;--ok-f:#e5f4ea;--att:#a15c00;--att-f:#fdf1dc;--err:#b3261e;--err-f:#fbe7e6;--blu-f:#e8eef5}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--testo);background:var(--fondo)}
header{background:var(--ardesia);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;padding:12px 0;font-weight:600;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{background:none;border:0;color:#dbe4ee;padding:14px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
header .chi{font-size:12px;color:#c9d4e0;white-space:nowrap}
main{padding:16px;max-width:1400px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.barra .spazio{flex:1}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--linea);border-radius:6px;background:#fff;color:inherit;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
button.b{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--linea);background:#fff;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--ardesia)}
button.p{background:var(--ardesia);color:#fff;border-color:var(--ardesia)}
button.p:hover{background:var(--ardesia-2)}
button.r{color:var(--err)}
button.l{border:0;background:none;color:var(--ardesia);padding:0;cursor:pointer;font:inherit;text-decoration:underline;text-align:left}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:14px;margin-bottom:14px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.num{font-size:28px;font-weight:600;color:var(--ardesia)}
.tenue{color:var(--tenue)}
.piccolo{font-size:12px}
table{border-collapse:collapse;width:100%;background:var(--carta)}
th,td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--tenue);font-weight:600;background:#fafbfc;position:sticky;top:0}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--blu-f)}
.scroll{overflow-x:auto;border:1px solid var(--linea);border-radius:10px;background:var(--carta)}
.scroll table{border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--blu-f);color:var(--ardesia-2);white-space:nowrap}
.tag.ok{background:var(--ok-f);color:var(--ok)}.tag.att{background:var(--att-f);color:var(--att)}.tag.err{background:var(--err-f);color:var(--err)}
.planning th,.planning td{border-right:1px solid var(--linea);min-width:130px}
.planning td:first-child,.planning th:first-child{min-width:90px;font-weight:600;background:#fafbfc}
.blocco{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--ardesia);background:var(--blu-f);border-radius:4px;padding:4px 6px;margin-bottom:4px;font:inherit;font-size:12px;cursor:pointer}
.blocco b{display:block;font-size:13px}
.blocco.vuoto{border-left-color:var(--att);background:var(--att-f)}
.campi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.campi label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tenue)}
.campi label.largo{grid-column:1/-1}
.campi label input,.campi label select{color:var(--testo)}
dialog{border:0;border-radius:12px;padding:0;width:min(900px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,30,45,.45)}
.dtesta{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:#fff;z-index:2}
.dtesta h2{margin:0;flex:1}
.dcorpo{padding:14px 18px 20px}
#avviso{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--testo);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:90vw}
#avviso.err{background:var(--err)}
#attesa{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);background-size:200% 100%;animation:a 1s linear infinite;display:none;z-index:60}
@keyframes a{from{background-position:200% 0}to{background-position:-200% 0}}
.lista{margin:0;padding:0;list-style:none}
.lista li{padding:5px 0;border-bottom:1px solid var(--linea)}
.lista li:last-child{border:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:5px;align-items:center}
.vuoto-msg{color:var(--tenue);padding:10px 0}
@media print{header,.barra,.no-stampa,button{display:none!important}main{padding:0}.card,.scroll{border:0}body{background:#fff}th{position:static}}
@media (max-width:640px){main{padding:10px}header{gap:4px}header .chi{display:none}}
</style>
</head>
<body>
<div id="attesa"></div>
<header>
  <h1>Gestionale ALIA</h1>
  <nav id="schede"></nav>
  <span class="chi" id="chi"></span>
</header>
<main id="main"><p class="vuoto-msg">Carico i dati…</p></main>
<dialog id="dlg"></dialog>
<div id="avviso"></div>
<datalist id="livelli"></datalist>

<script>
var D = null;                 // i dati dal foglio (carica() in Gestionale.gs)
var U = {scheda: 'oggi', cerca: '', stato: 'attivi', periodo: 'tutti', settimana: null, classeReg: '', docClasse: '', docDal: '', docAl: '', fattureTutte: false};
try { var salvata = localStorage.getItem('alia-scheda'); if (salvata) U.scheda = salvata; } catch (e) {}

var SCHEDE = [['oggi', 'Oggi'], ['studenti', 'Studenti'], ['classi', 'Classi'], ['registro', 'Registro'],
  ['pagamenti', 'Pagamenti'], ['documenti', 'Diplomi e attestati'], ['email', 'Email'], ['impostazioni', 'Impostazioni']];
var MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

/* ---------- utilità ---------- */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function gg(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return +p[2] + ' ' + MESI[+p[1] - 1]; }
function ggA(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function euro(n) { if (n === '' || n === null || n === undefined || isNaN(n)) return ''; return Number(n).toLocaleString('it-IT', {style: 'currency', currency: 'EUR'}); }
function dataDa(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function isoDa(d) { return d.toISOString().slice(0, 10); }
function piu(iso, n) { var d = dataDa(iso); d.setUTCDate(d.getUTCDate() + n); return isoDa(d); }
function lunedi(iso) { var d = dataDa(iso), w = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - w); return isoDa(d); }
function sovrap(a1, a2, b1, b2) { return a1 && a2 && b1 && b2 && a1 <= b2 && a2 >= b1; }
function nome(v) { return v.nome + ' ' + v.cognome; }
function attiva(v) { return v.stato !== 'Annullata'; }

function avviso(t, err) {
  var a = $('#avviso'); a.textContent = t; a.className = err ? 'err' : ''; a.style.display = 'block';
  clearTimeout(avviso.t); avviso.t = setTimeout(function () { a.style.display = 'none'; }, err ? 8000 : 3500);
}
/* Chiama una funzione di Gestionale.gs; quasi tutte rispondono con i dati aggiornati. */
function chiama(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  $('#attesa').style.display = 'block';
  return new Promise(function (ok, ko) {
    var r = google.script.run.withSuccessHandler(function (d) { $('#attesa').style.display = 'none'; if (d && d.iscrizioni) { D = d; indici(); } ok(d); })
      .withFailureHandler(function (e) { $('#attesa').style.display = 'none'; avviso(String(e && e.message || e), true); ko(e); });
    r[fn].apply(r, args);
  });
}

var ISC = {}, CLA = {};
function indici() {
  ISC = {}; CLA = {};
  D.iscrizioni.forEach(function (v) { ISC[v.id] = v; });
  D.classi.forEach(function (c) { CLA[c.id] = c; });
  $('#livelli').innerHTML = D.livelli.map(function (l) { return '<option value="' + esc(l) + '">'; }).join('');
}
function assDi(id) { return D.assegnazioni.filter(function (a) { return a.iscrizione === id; }); }
function assDiClasse(c) { return D.assegnazioni.filter(function (a) { return a.classe === c; }); }
function inClasseNelPeriodo(id, da, a) { return assDi(id).some(function (x) { return sovrap(x.dal, x.al, da, a); }); }
function frequenza(id) {
  var ore = 0, lez = 0, tot = 0;
  assDi(id).forEach(function (a) {
    D.registro.forEach(function (l) {
      if (l.classe !== a.classe || l.data < a.dal || l.data > a.al) return;
      tot += Number(l.ore) || 0;
      if (String(l.assenti || '').split(/\s*,\s*/).indexOf(id) >= 0) return;
      ore += Number(l.ore) || 0; lez++;
    });
  });
  return {ore: ore, lezioni: lez, previste: tot};
}
function statoTag(s) {
  var c = {Nuova: 'att', Confermata: '', Pagata: 'ok', 'In corso': 'ok', Conclusa: '', Annullata: 'err'}[s];
  return '<span class="tag ' + (c || '') + '">' + esc(s) + '</span>';
}
function aule() { return String(D.impostazioni.aule || '').split(',').map(function (s) { return s.trim(); }).filter(String); }

/* ---------- struttura ---------- */
function disegna() {
  $('#schede').innerHTML = SCHEDE.map(function (s) { return '<button data-s="' + s[0] + '" class="' + (U.scheda === s[0] ? 'on' : '') + '">' + s[1] + '</button>'; }).join('');
  $('#chi').textContent = D.utente;
  var f = VISTE[U.scheda] || VISTE.oggi;
  $('#main').innerHTML = f();
  if (DOPO[U.scheda]) DOPO[U.scheda]();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-s]');
  if (b) { U.scheda = b.getAttribute('data-s'); try { localStorage.setItem('alia-scheda', U.scheda); } catch (x) {} disegna(); return; }
  var s = e.target.closest('[data-stud]');
  if (s) { e.preventDefault(); apriStudente(s.getAttribute('data-stud')); return; }
  var c = e.target.closest('[data-classe]');
  if (c) { e.preventDefault(); apriClasse(c.getAttribute('data-classe')); return; }
});
function linkStud(v) { return '<button class="l" data-stud="' + esc(v.id) + '">' + esc(nome(v)) + '</button>'; }

var VISTE = {}, DOPO = {};

/* ---------- OGGI ---------- */
VISTE.oggi = function () {
  var o = D.oggi, lun = lunedi(o), dom = piu(lun, 6), att = D.iscrizioni.filter(attiva);
  var inCorso = att.filter(function (v) { return v.inizio <= o && v.fine >= o; });
  var arrivi = att.filter(function (v) { return v.inizio > o && v.inizio <= piu(o, 14); }).sort(function (a, b) { return a.inizio < b.inizio ? -1 : 1; });
  var fine = att.filter(function (v) { return v.fine >= o && v.fine <= piu(o, 7); }).sort(function (a, b) { return a.fine < b.fine ? -1 : 1; });
  var nuove = D.iscrizioni.filter(function (v) { return v.stato === 'Nuova'; });
  var senza = att.filter(function (v) { return sovrap(v.inizio, v.fine, lun, dom) && !inClasseNelPeriodo(v.id, lun, dom); });
  var scad = D.fatture.filter(function (f) { return f.da_pagare > 0 && f.scadenza && f.scadenza < o; });
  var md = [], i; for (i = 0; i < 7; i++) md.push(piu(lun, i).slice(5));
  var compl = att.filter(function (v) { return v.nascita && md.indexOf(v.nascita.slice(5)) >= 0 && sovrap(v.inizio, v.fine, lun, dom); });
  function scheda(titolo, n, righe, vuoto) {
    return '<div class="card"><div class="tenue">' + titolo + '</div><div class="num">' + n + '</div>' +
      (righe.length ? '<ul class="lista">' + righe.slice(0, 12).join('') + '</ul>' + (righe.length > 12 ? '<div class="tenue piccolo">e altri ' + (righe.length - 12) + '</div>' : '') : '<div class="tenue piccolo">' + vuoto + '</div>') + '</div>';
  }
  var riga = function (v, extra) { return '<li>' + linkStud(v) + ' <span class="tenue piccolo">' + esc(extra) + '</span></li>'; };
  return '<h2>Oggi, ' + gg(o) + '</h2><div class="griglia">' +
    scheda('In corso oggi', inCorso.length, inCorso.map(function (v) { return riga(v, v.corso_nome + ' · fino al ' + gg(v.fine)); }), 'Nessuno studente in corso.') +
    scheda('Arrivano nei prossimi 14 giorni', arrivi.length, arrivi.map(function (v) { return riga(v, gg(v.inizio) + ' · ' + v.corso_nome + (v.livello ? ' · ' + v.livello : '')); }), 'Nessun arrivo.') +
    scheda('Senza classe questa settimana', senza.length, senza.map(function (v) { return riga(v, gg(v.inizio) + '–' + gg(v.fine) + (v.livello ? ' · ' + v.livello : '')); }), 'Tutti hanno una classe.') +
    scheda('Finiscono entro 7 giorni (diplomi e attestati)', fine.length, fine.map(function (v) { return riga(v, gg(v.fine) + (v.livello_finale ? ' · ' + v.livello_finale : ' · livello da scrivere')); }), 'Nessuno.') +
    scheda('Iscrizioni nuove da confermare', nuove.length, nuove.map(function (v) { return riga(v, v.corso_nome + ' · ' + gg(v.inizio)); }), 'Nessuna.') +
    scheda('Pagamenti scaduti', scad.length, scad.map(function (f) { var v = ISC[f.iscrizione]; return '<li>' + (v ? linkStud(v) : esc(f.cliente)) + ' <span class="tenue piccolo">' + esc(f.numero) + ' · ' + euro(f.da_pagare) + ' · ' + gg(f.scadenza) + '</span></li>'; }), D.fic_token ? 'Nessuno.' : 'Collega Fatture in Cloud in Impostazioni.') +
    scheda('Compleanni questa settimana', compl.length, compl.map(function (v) { return riga(v, gg(v.nascita)); }), 'Nessuno.') +
    '</div>';
};

/* ---------- STUDENTI ---------- */
VISTE.studenti = function () {
  var o = D.oggi, q = U.cerca.toLowerCase();
  var l = D.iscrizioni.filter(function (v) {
    if (U.stato === 'attivi' && !attiva(v)) return false;
    if (U.stato !== 'attivi' && U.stato !== 'tutti' && v.stato !== U.stato) return false;
    if (U.periodo === 'in_corso' && !(v.inizio <= o && v.fine >= o)) return false;
    if (U.periodo === 'futuri' && !(v.inizio > o)) return false;
    if (U.periodo === 'passati' && !(v.fine < o)) return false;
    if (q && [v.id, v.nome, v.cognome, v.email, v.corso_nome, v.nazionalita].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return (b.inizio || '') < (a.inizio || '') ? -1 : 1; });
  return '<div class="barra"><input id="cerca" type="search" placeholder="Cerca nome, email, corso…" value="' + esc(U.cerca) + '" style="min-width:220px">' +
    '<select id="fstato"><option value="attivi">Tutte tranne annullate</option><option value="tutti">Tutte</option>' + D.stati.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</select>' +
    '<select id="fperiodo"><option value="tutti">Ogni periodo</option><option value="in_corso">In corso oggi</option><option value="futuri">Devono arrivare</option><option value="passati">Concluse</option></select>' +
    '<span class="spazio"></span><span class="tenue">' + l.length + ' iscrizioni</span><button class="b p" id="nuova">Nuova iscrizione</button></div>' +
    '<div class="scroll"><table><thead><tr><th>N.</th><th>Studente</th><th>Corso</th><th>Periodo</th><th>Livello</th><th>Classe</th><th>Stato</th><th>Da pagare</th></tr></thead><tbody>' +
    (l.map(function (v) {
      var cl = assDi(v.id).map(function (a) { return CLA[a.classe] ? CLA[a.classe].nome : ''; }).filter(String).join(', ');
      return '<tr class="cl" data-stud="' + esc(v.id) + '"><td class="piccolo tenue">' + esc(v.id) + '</td><td>' + esc(nome(v)) + '<div class="tenue piccolo">' + esc(v.nazionalita) + '</div></td><td>' + esc(v.corso_nome) + (v.tema ? '<div class="tenue piccolo">' + esc(v.tema) + '</div>' : '') + '</td><td>' + gg(v.inizio) + ' – ' + gg(v.fine) + '</td><td>' + esc(v.livello) + (v.livello_finale ? ' → <b>' + esc(v.livello_finale) + '</b>' : '') + '</td><td>' + (cl ? esc(cl) : (sovrap(v.inizio, v.fine, o, '9999') && attiva(v) ? '<span class="tag att">da assegnare</span>' : '')) + '</td><td>' + statoTag(v.stato) + '</td><td>' + (Number(v.residuo) > 0 ? euro(v.residuo) : '') + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="vuoto-msg">Nessuna iscrizione.</td></tr>') + '</tbody></table></div>';
};
DOPO.studenti = function () {
  $('#fstato').value = U.stato; $('#fperiodo').value = U.periodo;
  $('#cerca').oninput = function () { U.cerca = this.value; var p = this.selectionStart; disegna(); var c = $('#cerca'); c.focus(); c.setSelectionRange(p, p); };
  $('#fstato').onchange = function () { U.stato = this.value; disegna(); };
  $('#fperiodo').onchange = function () { U.periodo = this.value; disegna(); };
  $('#nuova').onclick = nuovaIscrizione;
};

function dialogo(titolo, corpo, azioni) {
  var d = $('#dlg');
  d.innerHTML = '<div class="dtesta"><h2>' + titolo + '</h2>' + (azioni || '') + '<button class="b" id="chiudi">Chiudi</button></div><div class="dcorpo">' + corpo + '</div>';
  $('#chiudi').onclick = function () { d.close(); };
  if (!d.open) d.showModal();
  return d;
}
function campo(id, etichetta, valore, tipo, extra) {
  return '<label' + (tipo === 'textarea' ? ' class="largo"' : '') + '>' + etichetta +
    (tipo === 'textarea' ? '<textarea id="' + id + '">' + esc(valore) + '</textarea>' :
      '<input id="' + id + '" type="' + (tipo || 'text') + '" value="' + esc(valore) + '"' + (extra || '') + '>') + '</label>';
}
function scelta(id, etichetta, valore, opzioni) {
  return '<label>' + etichetta + '<select id="' + id + '">' + opzioni.map(function (o) {
    var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
    return '<option value="' + esc(v) + '"' + (String(v) === String(valore) ? ' selected' : '') + '>' + esc(t) + '</option>';
  }).join('') + '</select></label>';
}

function apriStudente(id) {
  var v = ISC[id]; if (!v) return;
  var f = frequenza(id), ass = assDi(id);
  var fatt = D.fatture.filter(function (x) { return x.iscrizione === id; });
  var docs = D.documenti.filter(function (x) { return x.iscrizione === id; });
  var classiPossibili = D.classi.filter(function (c) { return sovrap(c.inizio, c.fine, v.inizio || D.oggi, v.fine || '9999'); });
  var corpo =
    '<div class="campi">' +
    scelta('s-stato', 'Stato', v.stato, D.stati) +
    campo('s-inizio', 'Inizio', v.inizio, 'date') + campo('s-fine', 'Fine', v.fine, 'date') +
    campo('s-livello', 'Livello iniziale', v.livello, 'text', ' list="livelli"') +
    campo('s-livello_finale', 'Livello raggiunto', v.livello_finale, 'text', ' list="livelli"') +
    campo('s-prezzo', 'Prezzo confermato (€)', v.prezzo, 'number', ' step="0.01" placeholder="' + esc(v.totale) + '"') +
    campo('s-email', 'Email', v.email, 'email') + campo('s-telefono', 'Telefono', v.telefono) +
    campo('s-note_staff', 'Note dello staff', v.note_staff, 'textarea') +
    '</div><div class="barra" style="margin-top:10px"><span class="spazio"></span><button class="b p" id="s-salva">Salva</button></div>' +
    '<h3>Corso</h3><div class="piccolo">' + esc(v.corso_nome) + (v.tema ? ' · ' + esc(v.tema) : '') + (v.formula ? ' · ' + esc(v.formula) : '') +
    ' · ' + esc(v.settimane) + ' settimane · ' + esc(v.lezioni_totali) + ' lezioni' + (v.alloggio ? ' · Alloggio: ' + esc(v.alloggio) : '') + (v.extra ? ' · Extra: ' + esc(v.extra) : '') +
    '<br>Totale stimato ' + euro(v.totale) + ' · Pagato ' + euro(v.pagato || 0) + ' · <b>Da pagare ' + euro(v.residuo) + '</b>' +
    '<br>Nato/a ' + ggA(v.nascita) + (v.luogo_nascita ? ' a ' + esc(v.luogo_nascita) : '') + ' · ' + esc(v.nazionalita) + (v.visto ? ' · Visto: ' + esc(v.visto) : '') +

VISTE.classi = function () {

      if (!aula && !cl.length) { h += '<td></td>'; return; }
      h += '<td>' + cl.map(function (c) {

    return '<td>' + (l.length ? '<button class="blocco vuoto" data-senza="' + s + '"><b>' + l.length + ' studenti</b>' + esc(l.slice(0, 3).map(nome).join(', ')) + (l.length > 3 ? '…' : '') + '</button>' : '') + '</td>';
  }).join('') + '</tr></tbody></table></div>';
  var prossime = D.classi.filter(function (c) { return c.fine >= D.oggi; }).sort(function (a, b) { return a.inizio < b.inizio ? -1 : 1; });
  var finite = D.classi.filter(function (c) { return c.fine < D.oggi; }).sort(function (a, b) { return a.fine > b.fine ? -1 : 1; }).slice(0, 20);
  var tab = function (l) { return '<div class="scroll"><table><thead><tr><th>Classe</th><th>Aula</th><th>Livello</th><th>Insegnante</th><th>Periodo</th><th>Studenti</th></tr></thead><tbody>' +

    }).join('') + '</tbody></table>' : '<div class="vuoto-msg">Ancora nessuno.</div>') +

    }).join('') + '</div><div class="barra" style="margin-top:8px"><button class="b p" id="k-aggiungi">Aggiungi i selezionati</button></div>' : '<div class="vuoto-msg">Nessun altro studente nel periodo.</div>') +
    '<h3>Email a tutta la classe</h3><div class="campi">' + campo('k-oggetto', 'Oggetto', '') + campo('k-testo', 'Testo ({{nome}} = nome dello studente)', 'Ciao {{nome}},\n\n', 'textarea') + '</div>' +
    '<div class="barra" style="margin-top:8px"><button class="b" id="k-email">Manda a ' + ass.filter(function (a) { return a.al >= D.oggi; }).length + ' studenti</button></div>';

  if ($('#k-aggiungi', d)) $('#k-aggiungi', d).onclick = function () {

var COL_REG = [['volume', 'Volume/Capitolo'], ['novita', 'Novità'], ['ascolto', 'Attività ascolto'], ['lettura', 'Attività lettura'], ['scritta', 'Attività prod. scritta'], ['orale', 'Attività prod. orale'], ['ripetuto', 'Ripetuto'], ['da_ripetere', 'Da ripetere'], ['note', 'Note']];
VISTE.registro = function () {
  // Prima le classi in corso oggi, poi le future, poi le finite.
  var ordine = function (c) { return c.inizio <= D.oggi && c.fine >= D.oggi ? 0 : c.inizio > D.oggi ? 1 : 2; };
  var cl = D.classi.slice().sort(function (a, b) { return ordine(a) - ordine(b) || (a.inizio < b.inizio ? 1 : -1); });
  if (!U.classeReg || !CLA[U.classeReg]) U.classeReg = cl.length ? cl[0].id : '';
  var h = '<div class="barra"><select id="rclasse">' + cl.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === U.classeReg ? ' selected' : '') + '>' + esc(c.nome) + ' (' + gg(c.inizio) + '–' + gg(c.fine) + ')</option>'; }).join('') + '</select>' +
    '<span class="spazio"></span><button class="b" onclick="window.print()">Stampa</button><button class="b p" id="nuovalez">Nuova lezione</button></div>';
  if (!U.classeReg) return h + '<div class="vuoto-msg">Crea prima una classe in Classi.</div>';
  var c = CLA[U.classeReg];
  var lez = D.registro.filter(function (l) { return l.classe === c.id; }).sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.orario < b.orario ? -1 : 1); });
  h += '<h2>Registro: ' + esc(c.nome) + '</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Ore</th>' + COL_REG.map(function (k) { return '<th>' + k[1] + '</th>'; }).join('') + '<th>Assenti</th></tr></thead><tbody>' +
    (lez.map(function (l) {
      var ass = String(l.assenti || '').split(/\s*,\s*/).filter(String).map(function (i) { return ISC[i] ? ISC[i].nome : i; }).join(', ');
      return '<tr class="cl" data-lez="' + esc(l.id) + '"><td>' + ggA(l.data) + (l.orario ? '<div class="tenue piccolo">' + esc(l.orario) + '</div>' : '') + '</td><td>' + esc(l.ore) + '</td>' +
        COL_REG.map(function (k) { return '<td style="white-space:pre-wrap">' + esc(l[k[0]]) + '</td>'; }).join('') + '<td>' + esc(ass) + '</td></tr>';
    }).join('') || '<tr><td colspan="12" class="vuoto-msg">Nessuna lezione. Premi “Nuova lezione”.</td></tr>') + '</tbody></table></div>';
  var ass = assDiClasse(c.id).filter(function (a) { return ISC[a.iscrizione]; });
  if (ass.length) h += '<h3>Presenze</h3><div class="scroll"><table><thead><tr><th>Studente</th><th>In classe</th><th>Ore frequentate</th><th>Lezioni</th></tr></thead><tbody>' + ass.map(function (a) {
    var f = frequenza(a.iscrizione), v = ISC[a.iscrizione];
    return '<tr><td>' + linkStud(v) + '</td><td>' + gg(a.dal) + ' – ' + gg(a.al) + '</td><td>' + f.ore + ' su ' + f.previste + (f.previste ? ' (' + Math.round(100 * f.ore / f.previste) + '%)' : '') + '</td><td>' + f.lezioni + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  return h;
};
DOPO.registro = function () {
  if ($('#rclasse')) $('#rclasse').onchange = function () { U.classeReg = this.value; disegna(); };
  $('#nuovalez').onclick = function () { if (U.classeReg) lezione(null); };

};

function lezione(id) {
  var c = CLA[U.classeReg];
  var prec = D.registro.filter(function (l) { return l.classe === c.id; }).sort(function (a, b) { return a.data < b.data ? 1 : -1; })[0];
  var l = id ? D.registro.filter(function (x) { return x.id === id; })[0] : {data: D.oggi, orario: (prec && prec.orario) || c.orario, ore: prec ? prec.ore : 3, insegnante: (prec && prec.insegnante) || c.insegnante, assenti: ''};
  var assenti = String(l.assenti || '').split(/\s*,\s*/);
  var corpo = '<div class="campi">' + campo('l-data', 'Data', l.data, 'date') + campo('l-orario', 'Orario', l.orario) + campo('l-ore', 'Ore di lezione', l.ore, 'number', ' step="0.5" min="0" max="12"') + campo('l-insegnante', 'Insegnante', l.insegnante) +
    COL_REG.map(function (k) { return '<label' + (k[0] === 'note' ? ' class="largo"' : '') + '>' + k[1] + '<textarea id="l-' + k[0] + '" style="min-height:44px">' + esc(l[k[0]]) + '</textarea></label>'; }).join('') + '</div>' +
    '<h3>Assenti</h3><div class="checks" id="l-assenti"></div>';
  var d = dialogo((id ? 'Lezione del ' + ggA(l.data) : 'Nuova lezione') + ' · ' + esc(c.nome), corpo, (id ? '<button class="b r" id="l-elimina">Elimina</button>' : '') + '<button class="b p" id="l-salva">Salva</button>');
  function studenti() {
    var giorno = $('#l-data', d).value;
    var ass = assDiClasse(c.id).filter(function (a) { return ISC[a.iscrizione] && a.dal <= giorno && a.al >= giorno; });
    $('#l-assenti', d).innerHTML = ass.length ? ass.map(function (a) { return '<label><input type="checkbox" value="' + esc(a.iscrizione) + '"' + (assenti.indexOf(a.iscrizione) >= 0 ? ' checked' : '') + '> ' + esc(nome(ISC[a.iscrizione])) + '</label>'; }).join('') : '<span class="tenue">Nessuno studente in classe in questo giorno.</span>';
  }
  studenti();
  $('#l-data', d).onchange = studenti;
  $('#l-salva', d).onclick = function () {
    var o = {id: id || '', classe: c.id, data: $('#l-data', d).value, orario: $('#l-orario', d).value, ore: $('#l-ore', d).value, insegnante: $('#l-insegnante', d).value,
      assenti: $$('#l-assenti input:checked', d).map(function (i) { return i.value; })};
    COL_REG.forEach(function (k) { o[k[0]] = $('#l-' + k[0], d).value; });
    if (!o.data) { avviso('Scrivi la data', true); return; }
    chiama('salvaLezione', o).then(function () { d.close(); avviso('Lezione salvata'); disegna(); });
  };
  if (id) $('#l-elimina', d).onclick = function () { if (confirm('Eliminare questa lezione?')) chiama('eliminaLezione', id).then(function () { d.close(); disegna(); }); };
}

/* ---------- PAGAMENTI ---------- */
VISTE.pagamenti = function () {
  if (!D.fic_token) return '<div class="card"><h2>Fatture in Cloud non è collegato</h2><p>Incolla il token in <button class="l" data-s="impostazioni">Impostazioni</button>. Come ottenerlo: ISTRUZIONI.md, punto 7.</p></div>';
  var o = D.oggi, l = D.fatture.filter(function (f) { return U.fattureTutte || f.da_pagare > 0; })
    .sort(function (a, b) { return (a.scadenza || '9') < (b.scadenza || '9') ? -1 : 1; });
  var ultimo = D.fatture.reduce(function (m, f) { return f.aggiornata > m ? f.aggiornata : m; }, '');
  var modo = {no: 'spenti', prova: 'in prova (vanno a info@)', si: 'attivi'}[D.impostazioni.promemoria];
  var senzaFattura = D.iscrizioni.filter(function (v) { return ['Confermata', 'Nuova'].indexOf(v.stato) >= 0 && v.inizio >= o && v.inizio <= piu(o, 30) && !D.fatture.some(function (f) { return f.iscrizione === v.id; }); });
  var nonAbbinate = D.fatture.filter(function (f) { return !f.iscrizione && f.da_pagare > 0; }).length;
  var opzioni = D.iscrizioni.slice().sort(function (a, b) { return a.cognome < b.cognome ? -1 : 1; });
  var h = '<div class="barra"><button class="b p" id="sync">Aggiorna da Fatture in Cloud</button><span class="tenue piccolo">Ultimo aggiornamento: ' + esc(ultimo || 'mai') + ' · Promemoria automatici: ' + esc(modo) + '</span>' +
    '<span class="spazio"></span><label class="piccolo"><input type="checkbox" id="tutte"' + (U.fattureTutte ? ' checked' : '') + '> anche quelle pagate</label></div>' +
    (nonAbbinate ? '<div class="card piccolo"><span class="tag att">' + nonAbbinate + ' da abbinare</span> Fatture non pagate senza iscrizione: scegli lo studente nella colonna “Iscrizione”, se no il promemoria non parte.</div>' : '') +
    '<div class="scroll"><table><thead><tr><th>Documento</th><th>Cliente</th><th>Iscrizione</th><th>Importo</th><th>Da pagare</th><th>Scadenza</th><th>Promemoria</th><th></th></tr></thead><tbody>' +
    (l.map(function (f) {
      var inviati = D.promemoria.filter(function (p) { return p.chiave.indexOf('pag:' + f.fic_id + ':') === 0; });
      var sc = f.da_pagare > 0 && f.scadenza ? (f.scadenza < o ? 'err' : (f.scadenza <= piu(o, 7) ? 'att' : '')) : 'ok';
      return '<tr><td>' + esc(f.tipo) + ' <b>' + esc(f.numero) + '</b><div class="tenue piccolo">' + ggA(f.data) + '</div></td><td>' + esc(f.cliente) + '<div class="tenue piccolo">' + esc(f.email) + '</div></td>' +
        '<td><select data-abbina="' + esc(f.fic_id) + '" style="max-width:190px"><option value="">— nessuna —</option>' + opzioni.map(function (v) { return '<option value="' + esc(v.id) + '"' + (v.id === f.iscrizione ? ' selected' : '') + '>' + esc(v.cognome + ' ' + v.nome) + ' · ' + gg(v.inizio) + '</option>'; }).join('') + '</select>' + (f.abbinata === 'manuale' ? '<div class="tenue piccolo">a mano</div>' : '') + '</td>' +
        '<td>' + euro(f.importo) + '</td><td>' + (f.da_pagare > 0 ? '<b>' + euro(f.da_pagare) + '</b>' : '<span class="tag ok">pagata</span>') + '</td><td>' + (f.scadenza ? '<span class="tag ' + sc + '">' + ggA(f.scadenza) + '</span>' : '') + '</td>' +
        '<td class="piccolo">' + inviati.map(function (p) { return esc(p.data.slice(0, 10)) + ' ' + esc(p.chiave.split(':')[3] || '') + (p.esito !== 'inviato' ? ' (' + esc(p.esito) + ')' : ''); }).join('<br>') + '</td>' +
        '<td>' + (f.da_pagare > 0 && f.iscrizione ? '<button class="b piccolo" data-prom="' + esc(f.fic_id) + '">Manda ora</button>' : '') + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="vuoto-msg">Niente da pagare. Premi “Aggiorna” per leggere le ultime fatture.</td></tr>') + '</tbody></table></div>';
  if (senzaFattura.length) h += '<h3>Iniziano entro 30 giorni e non hanno ancora fattura o proforma</h3><div class="card"><ul class="lista">' + senzaFattura.map(function (v) { return '<li>' + linkStud(v) + ' <span class="tenue piccolo">' + gg(v.inizio) + ' · ' + esc(v.corso_nome) + ' · ' + euro(v.prezzo || v.totale) + '</span></li>'; }).join('') + '</ul></div>';
  return h;
};
DOPO.pagamenti = function () {
  if (!$('#sync')) return;
  $('#sync').onclick = function () { chiama('sincronizzaFIC').then(function () { avviso('Aggiornato da Fatture in Cloud'); disegna(); }); };
  $('#tutte').onchange = function () { U.fattureTutte = this.checked; disegna(); };
  $$('[data-abbina]').forEach(function (s) { s.onchange = function () { chiama('abbinaFattura', s.getAttribute('data-abbina'), s.value).then(function () { avviso('Abbinata'); disegna(); }); }; });
  $$('[data-prom]').forEach(function (b) { b.onclick = function () {
    var prova = D.impostazioni.promemoria !== 'si';
    if (!confirm(prova ? 'I promemoria sono in prova: l’email va a info@ (non allo studente). Continuare?' : 'Mandare ora il promemoria allo studente?')) return;
    chiama('mandaPromemoria', b.getAttribute('data-prom')).then(function () { avviso('Promemoria mandato'); disegna(); });
  }; });
};

/* ---------- DIPLOMI E ATTESTATI ---------- */
function creaDoc(tipo, ids) {
  avviso('Creo il PDF… può volerci un minuto.');
  return chiama('creaDocumenti', tipo, ids).then(function (d) {
    disegna();
    dialogo('PDF pronto', '<p>' + ids.length + ' ' + (tipo === 'diploma' ? (ids.length > 1 ? 'diplomi' : 'diploma') : (ids.length > 1 ? 'attestati' : 'attestato')) + ', una pagina per studente.</p><p><a class="b p" style="text-decoration:none;display:inline-block" href="' + esc(d.creato) + '" target="_blank" rel="noopener">Apri il PDF da stampare</a></p>');
  });
}
VISTE.documenti = function () {
  var o = D.oggi;
  if (!U.docDal) { U.docDal = lunedi(o); U.docAl = piu(lunedi(o), 13); }
  var l = U.docClasse ? assDiClasse(U.docClasse).map(function (a) { return ISC[a.iscrizione]; }).filter(Boolean)
    : D.iscrizioni.filter(function (v) { return v.fine >= U.docDal && v.fine <= U.docAl; });
  l = l.filter(attiva).sort(function (a, b) { return a.cognome < b.cognome ? -1 : 1; });
  var link = function (k) { return D.impostazioni[k] ? '<a href="https://drive.google.com/open?id=' + esc(D.impostazioni[k]) + '" target="_blank" rel="noopener">apri</a>' : '<span class="tag err">manca</span>'; };
  return '<div class="card piccolo">Modelli: diploma ' + link('modello_diploma') + ' · attestato ' + link('modello_attestato') +
    '. Campi: {{nome}} {{cognome}} {{periodo}} {{livello}} {{corso}} {{ore}} {{dal}} {{al}} {{nascita}} {{luogo_nascita}} {{nazionalita}} {{data}} {{numero}}. Si cambiano in Impostazioni.</div>' +
    '<div class="barra"><select id="dclasse"><option value="">Studenti che finiscono tra…</option>' + D.classi.slice().sort(function (a, b) { return a.fine < b.fine ? 1 : -1; }).map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === U.docClasse ? ' selected' : '') + '>Classe: ' + esc(c.nome) + '</option>'; }).join('') + '</select>' +
    (U.docClasse ? '' : '<input type="date" id="ddal" value="' + esc(U.docDal) + '"> e <input type="date" id="dal2" value="' + esc(U.docAl) + '">') + '</div>' +
    '<div class="scroll"><table><thead><tr><th><input type="checkbox" id="dtutti" checked></th><th>Studente</th><th>Periodo</th><th>Corso</th><th>Livello iniziale</th><th>Livello raggiunto</th><th>Ore</th><th>Già fatti</th></tr></thead><tbody>' +
    (l.map(function (v) {
      var f = frequenza(v.id), fatti = D.documenti.filter(function (x) { return x.iscrizione === v.id; }).map(function (x) { return '<a href="' + esc(x.link) + '" target="_blank" rel="noopener">' + esc(x.tipo) + '</a>'; }).join(', ');
      return '<tr><td><input type="checkbox" class="dsel" value="' + esc(v.id) + '" checked></td><td>' + linkStud(v) + '</td><td>' + gg(v.inizio) + ' – ' + gg(v.fine) + '</td><td>' + esc(v.corso_nome) + '</td><td>' + esc(v.livello) + '</td>' +
        '<td><input data-liv="' + esc(v.id) + '" value="' + esc(v.livello_finale) + '" list="livelli" style="width:80px"></td><td>' + f.ore + (f.previste ? '/' + f.previste : '') + '</td><td class="piccolo">' + fatti + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="vuoto-msg">Nessuno studente.</td></tr>') + '</tbody></table></div>' +
    '<div class="barra" style="margin-top:12px"><span class="spazio"></span><button class="b" id="dattest">Crea gli attestati dei selezionati</button><button class="b p" id="ddipl">Crea i diplomi dei selezionati</button></div>' +
    '<h3>Ultimi documenti</h3><div class="scroll"><table><thead><tr><th>Creato</th><th>Tipo</th><th>N.</th><th>Studente</th><th>PDF</th></tr></thead><tbody>' +
    (D.documenti.slice(-30).reverse().map(function (x) { return '<tr><td>' + esc(x.data) + '</td><td>' + esc(x.tipo) + '</td><td>' + esc(x.numero) + '</td><td>' + esc(x.studente) + '</td><td><a href="' + esc(x.link) + '" target="_blank" rel="noopener">PDF</a></td></tr>'; }).join('') || '<tr><td colspan="5" class="vuoto-msg">Ancora nessuno.</td></tr>') + '</tbody></table></div>';
};
DOPO.documenti = function () {
  $('#dclasse').onchange = function () { U.docClasse = this.value; disegna(); };
  if ($('#ddal')) { $('#ddal').onchange = function () { U.docDal = this.value; disegna(); }; $('#dal2').onchange = function () { U.docAl = this.value; disegna(); }; }
  $('#dtutti').onchange = function () { var on = this.checked; $$('.dsel').forEach(function (c) { c.checked = on; }); };
  $$('[data-liv]').forEach(function (i) { i.onchange = function () { chiama('salvaIscrizione', i.getAttribute('data-liv'), {livello_finale: i.value.trim()}).then(function () { avviso('Livello salvato'); }); }; });
  var sel = function () { return $$('.dsel:checked').map(function (c) { return c.value; }); };
  $('#ddipl').onclick = function () { var s = sel(); if (s.length) creaDoc('diploma', s); };
  $('#dattest').onclick = function () { var s = sel(); if (s.length) creaDoc('attestato', s); };
};

/* ---------- EMAIL AUTOMATICHE ---------- */

VISTE.email = function () {
  var i = D.impostazioni;

    '<div class="card"><h3 style="margin-top:0">Promemoria di pagamento (Fatture in Cloud)</h3><div class="campi">' + scelta('e-promemoria', 'Stato', i.promemoria, MODI) +
    campo('e-promemoria_giorni', 'Giorni prima della scadenza', i.promemoria_giorni, 'number') + campo('e-dati_pagamento', 'Come pagare (IBAN, intestazione…), va in fondo all’email', i.dati_pagamento, 'textarea') + '</div>' +
    '<p class="tenue piccolo">Una email N giorni prima della scadenza, una 3 giorni dopo, una 17 giorni dopo. Solo per fatture e proforma abbinate a un’iscrizione. Le proforma si fermano quando l’iscrizione risulta pagata. Italiano o inglese secondo la lingua dell’iscrizione.</p></div>' +
    '<div class="card"><h3 style="margin-top:0">Auguri di compleanno</h3><div class="campi">' + scelta('e-compleanni', 'Stato', i.compleanni, MODI) +
    scelta('e-compleanni_chi', 'A chi', i.compleanni_chi, [['in_corso', 'Solo a chi è in corso'], ['tutti', 'Anche agli ex studenti']]) +
    campo('e-testo_compleanno_it', 'Testo in italiano ({{nome}})', i.testo_compleanno_it, 'textarea') + campo('e-testo_compleanno_en', 'Testo in inglese', i.testo_compleanno_en, 'textarea') + '</div></div>' +
    '<div class="card"><h3 style="margin-top:0">Email prima dell’arrivo</h3><div class="campi">' + scelta('e-benvenuto', 'Stato', i.benvenuto, MODI) +
    campo('e-benvenuto_giorni', 'Giorni prima dell’inizio', i.benvenuto_giorni, 'number') +
    campo('e-testo_benvenuto_it', 'Testo in italiano ({{nome}} {{inizio}} {{fine}} {{corso}})', i.testo_benvenuto_it, 'textarea') + campo('e-testo_benvenuto_en', 'Testo in inglese', i.testo_benvenuto_en, 'textarea') + '</div>' +
    '<p class="tenue piccolo">Solo per iscrizioni Confermate o Pagate. Controlla l’indirizzo e l’orario nel testo.</p></div>' +
    '<div class="card"><h3 style="margin-top:0">Riepilogo per lo staff</h3><div class="campi">' + scelta('e-riepilogo', 'Ogni mattina a info@', i.riepilogo, [['si', 'Sì'], ['no', 'No']]) + '</div>' +

    '<div class="barra"><span class="spazio"></span><button class="b p" id="e-salva">Salva</button></div>' +
    '<h3>Ultime email automatiche</h3><div class="scroll"><table><thead><tr><th>Data</th><th>Tipo</th><th>Studente</th><th>Email</th><th>Esito</th></tr></thead><tbody>' +
    (D.promemoria.slice(-50).reverse().map(function (p) { var v = ISC[p.iscrizione]; return '<tr><td>' + esc(p.data) + '</td><td>' + esc(p.tipo) + '</td><td>' + (v ? linkStud(v) : esc(p.iscrizione)) + '</td><td>' + esc(p.email) + '</td><td>' + esc(p.esito) + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="vuoto-msg">Nessuna.</td></tr>') + '</tbody></table></div>';
};
DOPO.email = function () {
  if ($('#attiva')) $('#attiva').onclick = function () { chiama('attivaInvii').then(function () { avviso('Invii automatici attivi'); disegna(); }); };
  $('#e-salva').onclick = function () {

    '<div class="card"><h3 style="margin-top:0">Fatture in Cloud</h3><p class="tenue piccolo">' + (D.fic_token ? '<span class="tag ok">collegato</span> Azienda ' + esc(i.fic_azienda || '(si legge al primo aggiornamento)') + '. Per cambiarlo incolla un token nuovo.' : '<span class="tag att">non collegato</span> Come ottenere il token: ISTRUZIONI.md, punto 7.') + '</p><div class="campi">' +
    campo('i-fic_token', 'Token (non si rilegge dopo il salvataggio)', '', 'password', ' autocomplete="off"') + '</div></div>' +

};
DOPO.impostazioni = function () {
