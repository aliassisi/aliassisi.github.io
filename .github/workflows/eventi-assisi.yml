name: Eventi ad Assisi

# Reads the public Google Calendar "Eventi ad Assisi" and writes
# data/eventi-assisi.json (script: .github/scripts/eventi_assisi.py).
# Commits only when the events change. A push made with GITHUB_TOKEN does not
# start other workflows, so this one starts "Deploy production" itself.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eventi-assisi
  cancel-in-progress: false

env:
  FEED: https://calendar.google.com/calendar/ical/ef0a837f8b67f98f72fa0649c1077a5dc5ce74290cdf2425cf8f68632665337a%40group.calendar.google.com/public/basic.ics

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the feed
        run: curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/eventi.ics" "$FEED"

      - name: Build the JSON
        run: python3 -I .github/scripts/eventi_assisi.py "$RUNNER_TEMP/eventi.ics" data/eventi-assisi.json

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/eventi-assisi.json && git ls-files --error-unmatch data/eventi-assisi.json >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "aliabot"
          git config user.email "aliabot@users.noreply.github.com"
          git add data/eventi-assisi.json
          git commit -m "Eventi ad Assisi: update data/eventi-assisi.json"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
