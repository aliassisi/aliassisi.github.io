name: publish staging

on:
  push:
    branch:
      - 'master'

jobs:
  publish-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Set current date as env variable NOW
        run: echo "::set-env name=NOW::$(date +'%Y-%m-%dT%H:%M:%S')"

      - name: Build site
        uses: aliassisi/hugo-build-action@v0.72.0
        env:
          SHA8: ${GITHUB_SHA::8}
          HUGO_PARAMS_NOINDEX: true
          HUGO_PARAMS_VERSION: v$(NOW)-${SHA8}
          HUGO_PARAMS_VERSIONURL: https://github.com/aliassisi/aliassisi.it/tree/${SHA8}
        with:
          args: -b https://${{ secrets.GCP_STAGING_BUCKET_NAME }}

      - uses: GoogleCloudPlatform/github-actions/setup-gcloud@master
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          export_default_credentials: true

      - name: Sync bucket contents
        run: gsutil -h "Cache-Control:no-cache,max-age=0" rsync -R public gs://${{ secrets.GCP_STAGING_BUCKET_NAME }}
