name: publish staging

on:
  push:
    branch:
      - "master"
    paths-ignore:
      - README.md
      - .forestry/*

jobs:
  publish-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Compute version bits
        run: |
          echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "SHA7=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Build site
        uses: jakejarvis/hugo-build-action@v0.78.1
        env:
          HUGO_PARAMS_NOINDEX: true
          HUGO_PARAMS_VERSION: v${{env.NOW}}-${{env.SHA7}}
          HUGO_PARAMS_VERSIONURL: https://github.com/aliassisi/aliassisi.it/tree/${{env.SHA7}}
        with:
          args: -b https://${{ secrets.GCP_STAGING_BUCKET_NAME }}

      - uses: GoogleCloudPlatform/github-actions/setup-gcloud@master
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          export_default_credentials: true

      - name: Sync bucket contents
        run: gsutil -h "Cache-Control:no-cache,max-age=0" rsync -R public gs://${{ secrets.GCP_STAGING_BUCKET_NAME }}
