name: Deploy production

# Publishes main to the gh-pages branch. GitHub Pages serves that branch.
# Runs on each push to main and every night at 02:30 UTC.
# PR previews live in gh-pages/pr-preview/ and are kept by clean-exclude.

on:
  push:
    branches: [main]
  # Every night, so start dates and closing dates that have passed drop out.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One writer at a time. The preview workflow uses the same group.
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'CLAUDE.md' --exclude '_site' ./ _site/

      - name: Drop past start dates and closing dates
        run: python3 -I .github/scripts/build_corsi.py _site

      - name: Add search engine tags, sitemap.xml and robots.txt
        run: python3 -I .github/scripts/build_seo.py _site

      - name: Add content versions to CSS and JS links
        run: python3 -I .github/scripts/version_assets.py _site

      - name: Rebuild the search index
        run: npx --yes pagefind@1.5.2 --site _site

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
