{{ define "main" }}

<section class="section bg-gray pb-2 pt-5">
  <div class="container">
    <div class="row">
      <div class="col-12">
        {{ with .Params.Image }}
        <img class="img-fluid w-100 mb-4" src="{{ . | relURL }}" alt="about image">
        {{ end }}
        {{ .Content }}
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 order-2 order-lg-1">
        <div class="row">
          {{ $paginator := .Paginate ( where .Data.Pages "Type" "book") 10 }}
          {{ range $paginator.Pages }}
          <div class="col-lg-4 col-sm-6 mb-5 filtr-item">
            {{ .Render "book" }}
          </div>
          {{ end }}
          <div class="col-12 mt-4">
            {{ template "_internal/pagination.html" . }}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{{ end }}
