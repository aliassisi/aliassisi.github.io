{{ define "main" }}

<!-- courses -->
<section class="section">
  <div class="container">
    <!-- category list -->
    <div class="row">
      <div class="col-12">
        <ul class="list-inline text-center filter-controls">
          <li class="list-inline-item m-3 text-uppercase active" data-filter="all">{{ i18n "all" }}</li>
          {{ $types := slice }}
          {{ range .Data.Pages }}
          {{ $types = $types | append .Params.Ctypes }}
          {{ end }}
          {{ range ( $types | uniq ) }}
          <li class="list-inline-item m-3 text-uppercase" data-filter="{{ . | urlize }}">{{ . | humanize }}</li>
          {{ end }}
        </ul>
      </div>
    </div>

    <!-- course list -->
    <div class="row filtr-container">
      <!-- course item -->
      {{ range .Data.Pages }}
      <div data-category="{{ delimit .Params.Ctypes ", " }}" class="col-lg-4 col-sm-6 mb-5 filtr-item">
        {{ .Render "course" }}
      </div>
      {{ end }}
    </div>
    <!-- /course list -->
  </div>
</section>
<!-- /courses -->

{{ end }}
