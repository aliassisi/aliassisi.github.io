{{ define "main" }}
<!-- contact -->
<script src="https://www.google.com/recaptcha/api.js"></script>
<script>
  function onSubmit(token) {
    var form = document.getElementById("contact-form");
    if (form.checkValidity() === false) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add('was-validated');
      return;
    }
    form.submit();
  }
</script>

<section class="section bg-gray">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <h2 class="section-title">{{ i18n "contact_us" }}</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-7 mb-4 mb-lg-0">
        <form id="contact-form" action="{{ site.Params.contact_form_action | safeURL }}" method="POST">
          <input type="text" class="form-control mb-3" id="name" name="name" placeholder="{{ i18n "name" }}" required/>
          <input type="email" class="form-control mb-3" id="mail" name="mail" placeholder="Email" required/>
          <input type="text" class="form-control mb-3" id="subject" name="subject" placeholder="{{ i18n "subject" }}" required/>
          <textarea name="message" id="message" class="form-control mb-3" placeholder="{{ i18n "message" }}" required></textarea>
          <button class="btn btn-primary g-recaptcha" data-sitekey="{{ site.Params.reCAPTCHAKey }}" data-callback='onSubmit' data-action='submit'>{{ i18n "send" }}</button>
          <div class="mt-3 invalid-feedback">{{ i18n "please-fill-form" }}.</div>
        </form>
      </div>
      <div class="col-lg-5 content">
        {{ .Content }}
        <a href="tel:{{ site.Params.mobile }}" class="text-color h5 d-block">{{ site.Params.mobile }}</a>
        <a href="mailto:{{ site.Params.email }}" class="text-color h5 d-block">{{ site.Params.email }}</a>
        <div class="text-color h6">{{ site.Params.address | markdownify }}</div>
      </div>
    </div>
  </div>
</section>
<!-- /contact -->

<!-- gmap -->
<section class="section pt-0">
  <!-- Google Map -->
  <div id="map_canvas"
  data-latitude="{{ site.Params.map.map_latitude }}"
  data-longitude="{{ site.Params.map.map_longitude }}"
  data-marker="{{ site.Params.map.map_marker | absURL }}"
  data-marker-name="{{ site.Title }}"></div>
</section>
<!-- /gmap -->

{{ end }}
