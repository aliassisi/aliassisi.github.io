<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guestbook · ALI Assisi</title>
<style>
:root{--ink:#12263f;--sky:#cfe4f3;--clay:#b4553a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ink);color:var(--sky);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;padding:12px 16px}
header{display:flex;flex-direction:column;gap:8px}
h1{font:italic 400 1.6rem/1.2 Georgia,"Times New Roman",serif;margin:0}
#tabs,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;color:var(--sky);background:transparent;border:1px solid var(--sky);border-radius:4px;padding:8px 14px;min-height:44px;cursor:pointer}
#tabs button{padding:6px 10px;min-height:38px;font-size:.9rem;font-variant-numeric:tabular-nums}
button:hover{background:rgba(207,228,243,.15)}
button[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:#fff}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#stage{flex:1;min-height:340px;position:relative;margin:12px 0 4px}
.book{position:absolute;inset:0}
.bar{justify-content:center;gap:12px}
#pos{min-width:9ch;text-align:center;font-variant-numeric:tabular-nums}
.note{margin:8px 0 0;font-size:.8rem;opacity:.8;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Guestbook</h1>
  <nav id="tabs" aria-label="Years"></nav>
</header>
<div id="stage" role="region" aria-label="Scanned pages of the guestbook"></div>
<div class="bar">
  <button id="prev" aria-label="Previous page">‹</button>
  <span id="pos" aria-live="polite">Loading…</span>
  <button id="next" aria-label="Next page">›</button>
  <button id="fs">Full screen</button>
</div>
<p class="note">Scans of the original guestbook. Personal addresses and contact details have been covered.</p>
<noscript>JavaScript is required to turn the pages.</noscript>
<script src="page-flip.browser.js"></script>
<script>

// One period = one folder in images/ with pages p01.jpg, p02.jpg…
// To add a year: new folder + one line below.
const PERIODS=[{"id": "1994-1995", "label": "1994–1995", "n": 43}, {"id": "1996-1997", "label": "1996–1997", "n": 72}, {"id": "1998-1999", "label": "1998–1999", "n": 57}, {"id": "2000-2001", "label": "2000–2001", "n": 58}, {"id": "2002", "label": "2002", "n": 21}, {"id": "2003-2004", "label": "2003–2004", "n": 29}, {"id": "2005-2006", "label": "2005–2006", "n": 22}, {"id": "2007-2009", "label": "2007–2009", "n": 17}, {"id": "2009-2010", "label": "2009–2010", "n": 23}, {"id": "2011-2012", "label": "2011–2012", "n": 21}, {"id": "2013-2014", "label": "2013–2014", "n": 13}, {"id": "2015-2016", "label": "2015–2016", "n": 7}, {"id": "2017-2018", "label": "2017–2018", "n": 8}, {"id": "2019-2020", "label": "2019–2020", "n": 13}, {"id": "2021-2022", "label": "2021–2022", "n": 9}, {"id": "2023-2024", "label": "2023–2024", "n": 14}, {"id": "2025-2026", "label": "2025–2026", "n": 7}];
const stage=document.getElementById('stage'),pos=document.getElementById('pos'),tabs=document.getElementById('tabs');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pf=null,el=null;

function label(){
  if(!pf)return;
  const i=pf.getCurrentPageIndex(),n=pf.getPageCount();
  const spread=pf.getOrientation()==='landscape'&&i>0&&i+1<n;
  pos.textContent=(i+1)+(spread?'–'+(i+2):'')+' / '+n;
}
function pages(p){
  return Array.from({length:p.n},(_,i)=>'images/'+p.id+'/p'+String(i+1).padStart(2,'0')+'.jpg');
}
function show(p,btn){
  if(!window.St){pos.textContent='Page viewer not loaded';return}
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===btn));
  if(pf){pf.destroy();pf=null}
  if(el)el.remove();
  pos.textContent='Loading…';
  el=document.createElement('div');el.className='book';stage.appendChild(el);
  pf=new St.PageFlip(el,{width:538,height:761,size:'stretch',minWidth:260,maxWidth:760,minHeight:368,maxHeight:1075,
    showCover:true,maxShadowOpacity:.45,flippingTime:reduce?1:700,mobileScrollSupport:false});
  pf.loadFromImages(pages(p));
  ['init','flip','changeOrientation'].forEach(e=>pf.on(e,label));
}
PERIODS.forEach((p,k)=>{
  const b=document.createElement('button');
  b.textContent=p.label;b.setAttribute('aria-pressed','false');
  b.onclick=()=>show(p,b);tabs.appendChild(b);
  if(k===0)show(p,b);
});
document.getElementById('prev').onclick=()=>pf&&pf.flipPrev();
document.getElementById('next').onclick=()=>pf&&pf.flipNext();
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')pf&&pf.flipPrev();
  if(e.key==='ArrowRight')pf&&pf.flipNext();
});
const fs=document.getElementById('fs');
if(!document.documentElement.requestFullscreen)fs.hidden=true;
fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange',()=>setTimeout(()=>pf&&pf.update(),200));
</script>
</body>
</html>
